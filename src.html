        {(option.status === 'preferred' || option.status === 'booked') && (
          <div className="mb-3">
            {option.linkedDayId && trip.days?.find(d => d.id === option.linkedDayId) ? (
              <div className="chip chip-ok">
                <Icon name="calendar" size={11} /> No roteiro do dia {fmtDate(trip.days.find(d => d.id === option.linkedDayId).date)}
              </div>
            ) : (
              <Button size="xs" variant="secondary" icon="calendar" onClick={() => setAddToRoteiroOpen(true)}>
                Adicionar ao roteiro
              </Button>
            )}
          </div>
        )}

        {/* Voting */}
        <div className="flex items-center gap-1 mb-3">
          <button onClick={() => handleVote('love')} disabled={busy} className={cx('flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-semibold transition-colors border', myVote === 'love' ? 'bg-accents border-accent text-accent-d' : 'border-rule hover:border-ink')}>
            ❤️ <span className="num">{counts.love || ''}</span>
          </button>
          <button onClick={() => handleVote('up')} disabled={busy} className={cx('flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-semibold transition-colors border', myVote === 'up' ? 'bg-okbg border-ok text-ok' : 'border-rule hover:border-ink')}>
            👍 <span className="num">{counts.up || ''}</span>
          </button>
          <button onClick={() => handleVote('down')} disabled={busy} className={cx('flex items-center gap-1 px-3 py-1.5 rounded-full text-sm font-semibold transition-colors border', myVote === 'down' ? 'bg-badbg border-bad text-bad' : 'border-rule hover:border-ink')}>
            👎 <span className="num">{counts.down || ''}</span>
          </button>
          <span className="ml-auto flex -space-x-1.5">
            {option.votes.slice(0, 5).map(v => {
              const m = memberOf(v.userId);
              if (!m) return null;
              return m.avatarUrl
                ? <img key={v.userId} src={m.avatarUrl} className="w-6 h-6 rounded-full border-2 border-white object-cover" title={`${m.name || m.email} · ${v.vote}`} alt="" />
                : <span key={v.userId} className="w-6 h-6 rounded-full border-2 border-white flex items-center justify-center text-white text-[10px] font-bold" style={{background: m.color || 'var(--ink-2)'}} title={`${m.name || m.email} · ${v.vote}`}>{(m.name?.[0] || m.email?.[0] || '?').toUpperCase()}</span>;
            })}
          </span>
        </div>

        {/* Status changer */}
        <div className="flex items-center gap-1 mb-3 flex-wrap">
          {Object.entries(OPTION_STATUS).map(([key, s]) => (
            <button key={key} onClick={() => handleStatusChange(key)} disabled={busy || option.status === key}
              className={cx('text-[10px] px-2 py-1 rounded-full font-semibold uppercase tracking-wider transition-colors border', option.status === key ? 'border-ink bg-ink text-white' : 'border-rule text-ink-3 hover:border-ink hover:text-ink')}>
              {s.label}
            </button>
          ))}
        </div>

        {/* Comments */}
        {option.comments.length > 0 && (
          <div className="space-y-2 mb-3 border-t border-rule pt-3">
            {option.comments.map(c => {
              const m = memberOf(c.userId);
              const isMine = c.userId === user?.id;
              return (
                <div key={c.id} className="flex items-start gap-2 text-sm group">
                  {m?.avatarUrl
                    ? <img src={m.avatarUrl} className="w-6 h-6 rounded-full object-cover flex-shrink-0" alt="" />
                    : <span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0" style={{background: m?.color || 'var(--ink-2)'}}>{(m?.name?.[0] || '?').toUpperCase()}</span>
                  }
                  <div className="flex-1 min-w-0">
                    <div className="flex items-baseline gap-2">
                      <span className="text-xs font-semibold">{m?.name || m?.email || '?'}</span>
                      <span className="text-[10px] text-ink-4">{new Date(c.createdAt).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    <div className="text-sm text-ink-2">{renderCommentText(c.text, trip.members)}</div>
                  </div>
                  {isMine && <button onClick={() => handleDeleteComment(c.id)} className="opacity-0 group-hover:opacity-100 text-ink-4 hover:text-bad text-xs">✕</button>}
                </div>
              );
            })}
          </div>
        )}

        <div className="flex items-center gap-2 pt-2">
          <MentionInput value={commentText} onChange={setCommentText} onSubmit={handleComment} members={trip.members} placeholder="Comentar... @ menciona alguém" disabled={busy} />
          <Button type="button" size="sm" variant="primary" onClick={handleComment} disabled={busy || !commentText.trim()}>Enviar</Button>
        </div>
      </div>
      {addToRoteiroOpen && <AddOptionToItineraryModal trip={trip} option={option} onClose={() => setAddToRoteiroOpen(false)} />}
    </article>
  );
}

/* Mapa tipo de opção → nome sugerido de categoria (heurística) */
function categoryForOptionType(type, categories) {
  const map = {
    hotel:      ['hospedagem','hotel','pousada','airbnb'],
    restaurant: ['aliment','restaurant','comida','food','janta','almoço','alimentação'],
    activity:   ['passeio','atividade','tour','activity','ingresso'],
    transport:  ['transporte','locomo','carro','uber','táxi','táxi','gasol','combust'],
    flight:     ['voo','flight','aéreo','aereo','passagem'],
    other:      ['extra','geral'],
  };
  const keys = map[type] || [];
  for (const cat of (categories || [])) {
    const n = (cat.name || '').toLowerCase();
    if (keys.some(k => n.includes(k))) return cat.id;
  }
  return null;
}

function AddOptionToItineraryModal({ trip, option, onClose }) {
  const { updateTrip } = useStore();
  const [dayId, setDayId] = useState(trip.days?.[0]?.id || '');
  const [time, setTime] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!dayId) return;
    setBusy(true);
    try {
      const catId = categoryForOptionType(option.type, trip.categories);
      const newBlock = makeBlock({
        title: option.name,
        time,
        location: option.location || '',
        cost: option.price != null ? option.price : null,
        currency: option.currency || trip.baseCurrency,
        categoryId: catId,
        notes: option.notes || '',
        link: option.link || '',
      });
      // Add block to day
      await updateTrip(trip.id, t => ({
        ...t,
        days: t.days.map(d => d.id === dayId ? { ...d, blocks: [...d.blocks, newBlock] } : d)
      }));
      // Persistir linked_day_id na option
      await updateOptionRow(option.id, { linkedDayId: dayId });
      const dayLabel = trip.days.find(d => d.id === dayId);
      toast.success(`Adicionado ao dia ${dayLabel ? fmtDate(dayLabel.date) : ''}`);
      onClose();
    } catch (e) { toast.error('Erro: ' + e.message); }
    finally { setBusy(false); }
  };

  return (
    <Modal open onClose={onClose} title="Adicionar ao roteiro" size="sm"
      footer={<><Button onClick={onClose}>Cancelar</Button><Button variant="primary" onClick={submit} disabled={busy || !dayId}>{busy ? 'Adicionando…' : 'Adicionar'}</Button></>}>
      <div className="space-y-3">
        <div className="text-sm text-ink-2">
          Cria um bloco no dia escolhido com dados dessa opção:
          <div className="mt-2 p-3 rounded-lg bg-paper-3 text-sm">
            <div className="font-semibold">{option.name}</div>
            {option.location && <div className="text-xs text-ink-3 mt-0.5">{option.location}</div>}
            {option.price != null && <div className="text-xs font-mono mt-1">{fmtMoney(option.price, option.currency || trip.baseCurrency)}</div>}
          </div>
        </div>
        <div><Label>Dia</Label>
          <Select value={dayId} onChange={e => setDayId(e.target.value)}>
            {(trip.days || []).map((d, i) => (
              <option key={d.id} value={d.id}>Dia {i + 1} — {fmtDate(d.date)}{d.title ? ` · ${d.title}` : ''}</option>
            ))}
          </Select>
        </div>
        <div><Label hint="opcional">Hora</Label>
          <TextInput type="time" value={time} onChange={e => setTime(e.target.value)} />
        </div>
      </div>
    </Modal>
  );
}

function OptionModal({ trip, option, onClose }) {
  const { user } = useAuth();
  const { refetchActive } = useStore();
  const isNew = !option;
  const [f, setF] = useState(() => option || { type: 'hotel', name: '', location: '', lat: null, lon: null, price: '', currency: trip.baseCurrency, priceUnit: '', link: '', imageUrl: '', notes: '', status: 'considering' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [geoBusy, setGeoBusy] = useState(false);

  const save = async () => {
    if (!f.name?.trim()) { setError('Nome é obrigatório'); return; }
    setBusy(true); setError('');
    try {
      if (isNew) await createOption(trip.id, f, user.id);
      else await updateOptionRow(option.id, f);
      refetchActive();
      onClose();
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const del = async () => {
    if (!confirm('Apagar essa opção?')) return;
    try { await deleteOptionRow(option.id); refetchActive(); onClose(); } catch (e) { toast.error(e.message); }
  };

  const geocodeLocation = async () => {
    if (!f.location?.trim()) return;
    setGeoBusy(true);
    try {
      const r = await geocode(f.location.trim());
      if (r) setF({ ...f, lat: r.lat, lon: r.lon });
      else toast.error('Não achei essa localização. Insira as coordenadas manualmente se souber.');
    } catch (e) { toast.error('Erro na busca: ' + e.message); }
    finally { setGeoBusy(false); }
  };

  return (
    <Modal open onClose={onClose} title={isNew ? 'Nova opção' : 'Editar opção'} size="lg"
      footer={
        <>
          {!isNew && <Button variant="danger" onClick={del}>Apagar</Button>}
          <span className="flex-1"></span>
          <Button onClick={onClose}>Cancelar</Button>
          <Button variant="accent" onClick={save} disabled={busy}>{busy ? 'Salvando...' : 'Salvar'}</Button>
        </>
      }>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <Label>Tipo</Label>
          <Select value={f.type} onChange={e => setF({ ...f, type: e.target.value })}>
            {OPTION_TYPES.map(t => <option key={t.id} value={t.id}>{t.emoji} {t.label}</option>)}
          </Select>
        </div>
        <div>
          <Label>Status</Label>
          <Select value={f.status} onChange={e => setF({ ...f, status: e.target.value })}>
            {Object.entries(OPTION_STATUS).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}
          </Select>
        </div>
        <div className="sm:col-span-2">
          <Label>Nome</Label>
          <TextInput value={f.name} onChange={e => setF({ ...f, name: e.target.value })} placeholder="Ex: Grand Punta Hotel, La Bourgogne, Passeio de barco..." autoFocus />
        </div>
        <div className="sm:col-span-2">
          <Label hint="cidade, endereço ou ponto de referência">Localização</Label>
          <div className="flex gap-2">
            <TextInput className="flex-1" value={f.location} onChange={e => setF({ ...f, location: e.target.value })} placeholder="Ex: Punta del Este, Uruguai" />
            <Button size="sm" onClick={geocodeLocation} disabled={geoBusy || !f.location?.trim()}>{geoBusy ? '...' : 'Buscar mapa'}</Button>
          </div>
          {f.lat != null && f.lon != null && <div className="text-[11px] text-ink-3 mt-1 num">📍 {f.lat.toFixed(4)}, {f.lon.toFixed(4)}</div>}
        </div>
        <div>
          <Label>Preço</Label>
          <CurrencyInput value={f.price} onChange={e => setF({ ...f, price: e.target.value })} currency={f.currency || trip.baseCurrency} />
        </div>
        <div>
          <Label>Por</Label>
          <Select value={f.priceUnit} onChange={e => setF({ ...f, priceUnit: e.target.value })}>
            <option value="">total</option>
            <option value="noite">noite</option>
            <option value="pessoa">pessoa</option>
            <option value="dia">dia</option>
            <option value="hora">hora</option>
          </Select>
        </div>
        <div className="sm:col-span-2">
          <Label>Link</Label>
          <TextInput type="url" value={f.link} onChange={e => setF({ ...f, link: e.target.value })} placeholder="https://booking.com/..." />
        </div>
        <div className="sm:col-span-2">
          <Label hint="cover que aparece no card">URL da imagem</Label>
          <TextInput type="url" value={f.imageUrl} onChange={e => setF({ ...f, imageUrl: e.target.value })} placeholder="https://..." />
        </div>
        <div className="sm:col-span-2">
          <Label>Notas</Label>
          <TextArea rows={3} value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} placeholder="Observações, prós, contras, qualquer coisa..." />
        </div>
        {error && <div className="sm:col-span-2 text-sm text-bad bg-badbg px-3 py-2 rounded-lg">{error}</div>}
      </div>
    </Modal>
  );
}

function NotesTab({ trip }) {
  const { updateTrip } = useStore();
  const [v, setV] = useState(trip.notes || '');
  const [status, setStatus] = useState('saved'); // saved | dirty | saving
  const timerRef = useRef(null);
  const lastSavedRef = useRef(trip.notes || '');

  // Sync quando trip muda (troca de viagem ou realtime)
  useEffect(() => {
    if (trip.notes !== lastSavedRef.current) {
      setV(trip.notes || '');
      lastSavedRef.current = trip.notes || '';
      setStatus('saved');
    }
  }, [trip.id, trip.notes]);

  const handleChange = (e) => {
    const val = e.target.value;
    setV(val);
    setStatus('dirty');
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(async () => {
      setStatus('saving');
      try {
        await updateTrip(trip.id, t => ({ ...t, notes: val }));
        lastSavedRef.current = val;
        setStatus('saved');
      } catch { setStatus('dirty'); }
    }, 800);
  };

  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  return (
    <div className="card p-5">
      <div className="flex items-center justify-between mb-2">
        <h3 className="text-sm font-semibold text-ink">Diário da viagem</h3>
        <div className="text-xs text-ink-3 flex items-center gap-1.5">
          {status === 'saving' && <><span className="w-1.5 h-1.5 rounded-full bg-warn animate-pulse"></span>salvando…</>}
          {status === 'dirty'  && <><span className="w-1.5 h-1.5 rounded-full bg-warn"></span>não salvo</>}
          {status === 'saved'  && <><span className="w-1.5 h-1.5 rounded-full bg-ok"></span>salvo</>}
        </div>
      </div>
      <TextArea value={v} onChange={handleChange} rows={20} placeholder="Coisas importantes, aprendizados, links, ideias soltas…" />
      <div className="text-xs text-ink-4 mt-2">{v.length} caracteres · autosalva enquanto você digita</div>
    </div>
  );
}

/* ==================== CONVERTER MODAL ==================== */

function ConverterModal({ open, onClose, baseCurrency }) {
  const fx = useFx(baseCurrency);
  const [amount, setAmount] = useState(100);
  const [from, setFrom] = useState(baseCurrency);
  const [to, setTo] = useState('USD');

  useEffect(() => { if (open) setFrom(baseCurrency); }, [open, baseCurrency]);

  const result = fx.rates ? convert(Number(amount) || 0, from, to, fx.rates) : null;

  return (
    <Modal open={open} onClose={onClose} title="Câmbio" size="sm"
      footer={<Button onClick={onClose}>Fechar</Button>}>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <div className="col-span-2"><Label>Valor</Label><NumberInput value={amount} onChange={e => setAmount(e.target.value)} autoFocus /></div>
          <div><Label>De</Label>
            <Select value={from} onChange={e => setFrom(e.target.value)}>
              {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
            </Select>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 items-end">
          <div className="col-span-2">
            <Label>Resultado</Label>
            <div className="field bg-stone-50 text-xl font-semibold num">{result != null ? fmtMoney(result, to) : (fx.loading ? '…' : '—')}</div>
          </div>
          <div><Label>Para</Label>
            <Select value={to} onChange={e => setTo(e.target.value)}>
              {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
            </Select>
          </div>
        </div>
        <div className="flex items-center justify-between pt-2 hairline">
          <div className="text-[11px] text-inks">{fx.rates ? `${fx.rates.stale ? '⚠ cache · ' : ''}Fonte ${fx.rates.source || 'cache'} · ${new Date(fx.rates.ts).toLocaleString('pt-BR')}` : 'Sem cotação'}</div>
          <Button size="xs" icon="refresh" onClick={fx.refresh} disabled={fx.loading}>Atualizar</Button>
        </div>
      </div>
    </Modal>
  );
}
