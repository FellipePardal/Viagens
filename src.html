      <main className="max-w-6xl mx-auto px-4 sm:px-8 lg:px-12 py-8 relative">
        {store.trips.some(t => t.archived) && (
          <div className="mb-6 flex items-center gap-2 bg-paper-2 p-1 rounded-full w-fit">
            <button onClick={() => setShowArchived(false)} className={cx('px-4 py-1.5 text-sm font-semibold rounded-full transition-colors', !showArchived ? 'bg-paper text-ink shadow-sm' : 'text-ink-3 hover:text-ink')}>Ativas ({activeCount})</button>
            <button onClick={() => setShowArchived(true)} className={cx('px-4 py-1.5 text-sm font-semibold rounded-full transition-colors', showArchived ? 'bg-paper text-ink shadow-sm' : 'text-ink-3 hover:text-ink')}>Arquivadas ({archivedCount})</button>
          </div>
        )}

        {trips.length === 0 ? (
          <EmptyState
            icon="ticket"
            title={showArchived ? 'Nada arquivado' : 'Nenhuma viagem ainda'}
            description={showArchived ? 'Viagens arquivadas aparecem aqui.' : 'Comece pela sua primeira ideia. Fica tudo salvo localmente.'}
            action={!showArchived && <Button variant="accent" icon="plus" onClick={() => setWizardOpen(true)}>Criar primeira viagem</Button>}
          />
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {trips.map((t, i) => (
              <div key={t.id} className={`fade-in-${Math.min(5, i+1)}`}>
                <TripCard
                  trip={t}
                  onOpen={() => onOpen(t.id)}
                  onDuplicate={() => duplicate(t)}
                  onArchive={() => updateTrip(t.id, tt => ({ ...tt, archived: !tt.archived }))}
                  onExport={() => exportOne(t)}
                  onDelete={() => setConfirmDel(t)}
                  onInvite={() => setInviteTrip(t)}
                />
              </div>
            ))}
          </div>
        )}
      </main>

      <NewTripWizard open={wizardOpen} onClose={() => setWizardOpen(false)} onCreate={async (trip) => { const id = await addTrip(trip); setWizardOpen(false); if (id) onOpen(id); }} existingTrips={store.trips} />

      {inviteTrip && <MembersModal open={true} onClose={() => setInviteTrip(null)} trip={inviteTrip} />}

      <Confirm
        open={!!confirmDel}
        onClose={() => setConfirmDel(null)}
        onConfirm={() => removeTrip(confirmDel.id)}
        title="Apagar viagem?"
        message={`Isso remove "${confirmDel?.name}" permanentemente. Não dá pra desfazer. Se quiser guardar, use "Exportar" antes.`}
        confirmLabel="Apagar"
        variant="danger"
      />
    </div>
  );
}

function TripCard({ trip, onOpen, onDuplicate, onArchive, onExport, onDelete, onInvite }) {
  const { user } = useAuth();
  const spent = tripSpent(trip);
  const nDays = daysBetween(trip.startDate, trip.endDate) + 1;
  const status = tripStatusChip(trip);
  const daysToGo = daysBetween(isoToday(), trip.startDate);
  const pctSpent = trip.budgetCeiling ? Math.min(100, (spent / trip.budgetCeiling) * 100) : 0;
  const overBudget = trip.budgetCeiling && spent > trip.budgetCeiling;
  const isOwner = trip.ownerId === user?.id;

  return (
    <article className="card card-hover cursor-pointer overflow-hidden group" onClick={onOpen}>
      {/* Hero band */}
      <div className="h-24 relative overflow-hidden" style={{background: `linear-gradient(135deg, ${trip.categories[0]?.color || '#FF385C'}22 0%, ${trip.categories[1]?.color || '#484848'}18 100%)`}}>
        <div className="absolute inset-0 flex items-center justify-between px-5">
          <div>
            <div className="text-[11px] font-semibold text-ink-3 uppercase tracking-wider">{trip.destination?.split(/[,\(]/)[0] || 'Sem destino'}</div>
            <div className="mt-1 flex items-center gap-2 text-xs text-ink-3 font-medium">
              <Icon name="calendar" size={12} />
              <span>{fmtDate(trip.startDate)} → {fmtDate(trip.endDate, { year: true })}</span>
            </div>
          </div>
          <span className={cx('chip', status.cls)}>{status.text}</span>
        </div>
        <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-0.5 bg-paper/95 backdrop-blur rounded-full px-1 py-0.5 shadow-sm">
          {isOwner && onInvite && (
            <IconButton icon="users" onClick={(e) => { e.stopPropagation(); onInvite(); }} title="Convidar" />
          )}
          <IconButton icon="duplicate" onClick={(e) => { e.stopPropagation(); onDuplicate(); }} title="Duplicar" />
          <IconButton icon="archive" onClick={(e) => { e.stopPropagation(); onArchive(); }} title={trip.archived ? 'Desarquivar' : 'Arquivar'} />
          <IconButton icon="download" onClick={(e) => { e.stopPropagation(); onExport(); }} title="Exportar" />
          <IconButton icon="trash" onClick={(e) => { e.stopPropagation(); onDelete(); }} title="Apagar" />
        </div>
      </div>

      <div className="p-5">
        <h3 className="text-xl font-bold text-ink leading-tight truncate">{trip.name}</h3>

        <div className="mt-3 flex items-center gap-3 text-sm text-ink-3">
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-ink-3"></span>{nDays} dias</span>
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-ink-3"></span>{trip.days.length} planejados</span>
          {daysToGo > 0 && daysToGo <= 90 && <span className="flex items-center gap-1 text-accent font-semibold ml-auto">em {daysToGo}d</span>}
        </div>

        {trip.budgetCeiling > 0 && (
          <div className="mt-4">
            <div className="flex items-baseline justify-between mb-1.5">
              <div className="text-xs text-ink-3 font-medium">Orçamento</div>
              <div className="text-sm font-semibold num">
                <span className={cx(overBudget && 'text-bad')}>{fmtMoneyCompact(spent, trip.baseCurrency)}</span>
                <span className="text-ink-4"> de {fmtMoneyCompact(trip.budgetCeiling, trip.baseCurrency)}</span>
              </div>
            </div>
            <div className="h-1.5 bg-paper-2 rounded-full overflow-hidden">
              <div className={cx('h-full transition-all rounded-full', overBudget ? 'bg-bad' : 'bg-ink')} style={{width: `${pctSpent}%`}}></div>
            </div>
          </div>
        )}

        <div className="mt-4 pt-4 border-t border-rule flex items-center justify-between text-xs text-ink-3">
          <div className="flex items-center gap-4">
            <span className="flex items-center gap-1"><Icon name="calendar" size={12} /> {trip.days.length}</span>
            <span className="flex items-center gap-1"><Icon name="checklist" size={12} /> {trip.checklist.filter(c=>c.done).length}/{trip.checklist.length}</span>
            <span className="flex items-center gap-1"><Icon name="quote" size={12} /> {trip.quotes.length}</span>
          </div>
          <span className="text-ink font-semibold flex items-center gap-1">Abrir <Icon name="chevronRight" size={12} /></span>
        </div>
      </div>
    </article>
  );
}

function tripStatusChip(trip) {
  const today = isoToday();
  if (trip.archived) return { text: 'Arquivada', cls: '' };
  if (trip.endDate < today) return { text: 'Concluída', cls: 'chip-ok' };
  if (trip.startDate <= today && trip.endDate >= today) return { text: 'Em andamento', cls: 'chip-accent' };
  const d = daysBetween(today, trip.startDate);
  if (d <= 30) return { text: `Em ${d}d`, cls: 'chip-warn' };
  return { text: `${d}d p/ ir`, cls: 'chip-ink' };
}

function tripSpent(trip) {
  // Soma custos dos blocos convertidos pra baseCurrency (aproximado: só considera mesma moeda por ora)
  if (!trip || !Array.isArray(trip.days)) return 0;
  let total = 0;
  trip.days.forEach(d => (d.blocks || []).forEach(b => {
    if (b.cost != null && (b.currency || trip.baseCurrency) === trip.baseCurrency) total += Number(b.cost);
  }));
  return total;
}

function NewTripWizard({ open, onClose, onCreate, existingTrips }) {
  const [step, setStep] = useState(0);
  const [templateId, setTemplateId] = useState('blank');
  const [duplicateFromId, setDuplicateFromId] = useState('');
  const [form, setForm] = useState({
    name: '', destination: '',
    startDate: isoToday(),
    endDate: isoAddDays(isoToday(), 7),
    baseCurrency: 'BRL',
    secondaryCurrencies: [],
    budgetCeiling: '',
  });

  useEffect(() => { if (open) { setStep(0); setTemplateId('blank'); setDuplicateFromId(''); setForm(f => ({ ...f, startDate: isoToday(), endDate: isoAddDays(isoToday(),7) })); } }, [open]);

  const create = () => {
    let trip;
    if (duplicateFromId) {
      const src = existingTrips.find(t => t.id === duplicateFromId);
      if (src) {
        trip = { ...clone(src), id: uid(), name: form.name || (src.name + ' (cópia)'),
          destination: form.destination || src.destination,
          startDate: form.startDate, endDate: form.endDate,
          baseCurrency: form.baseCurrency, secondaryCurrencies: form.secondaryCurrencies,
          budgetCeiling: Number(form.budgetCeiling) || 0,
          createdAt: new Date().toISOString(),
          members: [], ownerId: null,
        };
        // Ajusta datas dos dias proporcionalmente
        const oldStart = src.startDate;
        const shift = daysBetween(oldStart, form.startDate);
        // Renovar TODOS os ids dos filhos pra evitar conflito no banco
        trip.categories = (src.categories || []).map(c => ({ ...clone(c), id: uid() }));
        trip.travelers  = (src.travelers  || []).map(t => ({ ...clone(t), id: uid(), linkedUserId: null }));
        trip.checklist  = (src.checklist  || []).map(c => ({ ...clone(c), id: uid(), done: false }));
        trip.quotes     = (src.quotes     || []).map(q => ({ ...clone(q), id: uid() }));
        trip.mapPoints  = (src.mapPoints  || []).map(p => ({ ...clone(p), id: uid() }));
        // Mapeia catId antigo → novo para preservar referências dos blocks
        const catIdMap = {};
        (src.categories || []).forEach((c, i) => { catIdMap[c.id] = trip.categories[i].id; });
        trip.days = (src.days || []).map(d => {
          const newDayId = uid();
          return {
            ...clone(d), id: newDayId,
            date: isoAddDays(d.date, shift),
            blocks: (d.blocks || []).map(b => ({
              ...clone(b), id: uid(),
              done: false,
              categoryId: catIdMap[b.categoryId] || null,
              paidBy: null, splitBetween: null,
            })),
          };
        });
      }
    } else {
      const template = TEMPLATES.find(t => t.id === templateId);
      trip = template.build({
        name: form.name || 'Nova viagem',
        destination: form.destination,
        startDate: form.startDate,
        endDate: form.endDate,
        baseCurrency: form.baseCurrency,
        secondaryCurrencies: form.secondaryCurrencies,
        budgetCeiling: Number(form.budgetCeiling) || 0,
      });
    }
    onCreate(trip);
  };

  const step2Valid = form.name.trim().length > 0 && form.startDate && form.endDate && form.startDate <= form.endDate;

  return (
    <Modal open={open} onClose={onClose} title="Nova viagem" size="lg"
      footer={
        step === 0 ? (
          <>
            <Button onClick={onClose}>Cancelar</Button>
            <Button variant="primary" onClick={() => setStep(1)}>Próximo</Button>
          </>
        ) : (
          <>
            <Button onClick={() => setStep(0)}>Voltar</Button>
            <Button variant="primary" disabled={!step2Valid} onClick={create}>Criar viagem</Button>
          </>
        )
      }>
      {step === 0 ? (
        <div>
          <p className="text-sm text-inkm mb-4">Escolha um ponto de partida.</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {TEMPLATES.map(t => (
              <button key={t.id} onClick={() => { setTemplateId(t.id); setDuplicateFromId(''); }}
                className={cx('text-left p-3 rounded-lg border transition-colors',
                  templateId === t.id && !duplicateFromId
                    ? 'border-ink bg-stone-50' : 'border-line hover:border-lineh')}>
                <div className="text-sm font-semibold text-ink">{t.name}</div>
                <div className="text-xs text-inkm mt-0.5">{t.description}</div>
              </button>
            ))}
            {existingTrips.length > 0 && (
              <button onClick={() => { setDuplicateFromId(existingTrips[0].id); }}
                className={cx('text-left p-3 rounded-lg border transition-colors sm:col-span-2',
                  duplicateFromId ? 'border-ink bg-stone-50' : 'border-line hover:border-lineh')}>
                <div className="text-sm font-semibold text-ink">Duplicar uma viagem existente</div>
                <div className="text-xs text-inkm mt-0.5">Copia estrutura, categorias e checklist de uma viagem sua.</div>
                {duplicateFromId && (
                  <Select value={duplicateFromId} onChange={e => setDuplicateFromId(e.target.value)} onClick={e => e.stopPropagation()} className="mt-2">
                    {existingTrips.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </Select>
                )}
              </button>
            )}
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="sm:col-span-2">
            <Label>Nome da viagem</Label>
            <TextInput value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Ex: Uruguai · verão 2027" autoFocus />
          </div>
          <div className="sm:col-span-2">
            <Label>Destino</Label>
            <TextInput value={form.destination} onChange={e => setForm({ ...form, destination: e.target.value })} placeholder="Cidade, região ou país" />
          </div>
          <div>
            <Label>Data de ida</Label>
            <TextInput type="date" value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} />
          </div>
          <div>
            <Label>Data de volta</Label>
            <TextInput type="date" value={form.endDate} onChange={e => setForm({ ...form, endDate: e.target.value })} />
          </div>
          <div>
            <Label>Moeda base</Label>
            <Select value={form.baseCurrency} onChange={e => setForm({ ...form, baseCurrency: e.target.value, secondaryCurrencies: form.secondaryCurrencies.filter(c => c !== e.target.value) })}>
              {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.code} — {c.name}</option>)}
            </Select>
          </div>
          <div>
            <Label>Teto de orçamento</Label>
            <CurrencyInput value={form.budgetCeiling} onChange={e => setForm({ ...form, budgetCeiling: e.target.value })} currency={form.baseCurrency} placeholder="10.000,00" />
          </div>
          <div className="sm:col-span-2">
            <Label hint="opcional">Moedas secundárias</Label>
            <div className="flex flex-wrap gap-1.5">
              {CURRENCIES.filter(c => c.code !== form.baseCurrency).map(c => {
                const on = form.secondaryCurrencies.includes(c.code);
                return (
                  <button key={c.code} onClick={() => setForm({ ...form,
                    secondaryCurrencies: on
                      ? form.secondaryCurrencies.filter(x => x !== c.code)
                      : [...form.secondaryCurrencies, c.code] })}
                    className={cx('chip', on ? 'chip-ink' : '')}>
                    {c.code}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function TripView({ trip, onOpenLibrary, onConvert }) {
  const { user } = useAuth();
  const [tab, setTab] = useState('dashboard');
  const fx = useFx(trip.baseCurrency);
  const daysToGo = daysBetween(isoToday(), trip.startDate);
  const criticalCount = trip.checklist.filter(c => !c.done && c.critical).length;

  // Notifica menções direcionadas a mim em option_comments (via refetch de trip)
  const seenCommentsRef = useRef(new Set());
  useEffect(() => {
    if (!user) return;
    (trip.options || []).forEach(o => {
      (o.comments || []).forEach(c => {
        if (seenCommentsRef.current.has(c.id)) return;
        seenCommentsRef.current.add(c.id);
        // Só notifica se: (a) comentário recente (< 30s), (b) me mencionou, (c) não é meu
        if (c.userId === user.id) return;
        const isRecent = (Date.now() - new Date(c.createdAt).getTime()) < 30000;
        const mentioned = (c.mentionedUsers || []).includes(user.id);
        if (isRecent && mentioned) {
          const author = trip.members?.find(m => m.userId === c.userId);
          toast.info(`${author?.name || 'alguém'} te mencionou em "${o.name}"`);
        }
      });
    });
  }, [trip.options, user]);

  return (
    <div className="lg:grid" style={{ gridTemplateColumns: '280px 1fr' }}>
      <Sidebar trip={trip} tab={tab} onTab={setTab} onOpenLibrary={onOpenLibrary} onConvert={onConvert} />
      <div className="flex flex-col min-h-screen relative">
        <MobileTopBar trip={trip} onOpenLibrary={onOpenLibrary} onConvert={onConvert} />
        <main className="flex-1 px-4 sm:px-8 lg:px-10 py-6 lg:py-10 max-w-[1200px] w-full mx-auto lg:mx-0 relative z-10">
          <TripHeader trip={trip} daysToGo={daysToGo} />
          <div className="mt-8 fade-in-1" key={tab}>
            {tab === 'dashboard' && <DashboardTab trip={trip} fx={fx} onGo={setTab} />}
            {tab === 'options'   && <OptionsTab trip={trip} fx={fx} />}
            {tab === 'budget'    && <BudgetTab trip={trip} fx={fx} />}
            {tab === 'itinerary' && <ItineraryTab trip={trip} fx={fx} />}
            {tab === 'checklist' && <ChecklistTab trip={trip} />}
            {tab === 'map'       && <MapTab trip={trip} />}
            {tab === 'quotes'    && <QuotesTab trip={trip} fx={fx} />}
            {tab === 'split'     && <SplitTab trip={trip} fx={fx} />}
            {tab === 'notes'     && <NotesTab trip={trip} />}
          </div>
        </main>
        <MobileBottomNav tab={tab} onTab={setTab} criticalCount={criticalCount} />
      </div>
    </div>
  );
}

function ActivityDrawer({ trip, open, onClose }) {
  const items = trip.activity || [];
  const byUser = (uid) => trip.members?.find(m => m.userId === uid);

  useEffect(() => {
    if (!open) return;
    const esc = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [open, onClose]);

  if (!open) return null;

  const iconFor = (kind, ent) => {
    if (kind === 'done')   return { name: 'check',    color: 'var(--ok)' };
    if (kind === 'undone') return { name: 'x',        color: 'var(--ink-3)' };
    if (kind === 'status') return { name: 'star',     color: 'var(--accent)' };
    if (kind === 'delete') return { name: 'trash',    color: 'var(--bad)' };
    if (kind === 'invite') return { name: 'users',    color: 'var(--ok)' };
    if (kind === 'create') return { name: 'plus',     color: 'var(--ok)' };
    if (kind === 'update') return { name: 'edit',     color: 'var(--ink-3)' };
    return { name: 'info', color: 'var(--ink-3)' };
  };

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[9998]" onClick={onClose}>
      <div className="absolute inset-0 bg-black/40 overlay-in"></div>
      <aside className="absolute right-0 top-0 bottom-0 w-full max-w-md bg-paper border-l border-rule shadow-2xl overflow-y-auto fade-in" onClick={e => e.stopPropagation()} style={{boxShadow: 'var(--shadow-xl)'}}>
        <div className="sticky top-0 bg-paper border-b border-rule p-4 flex items-center justify-between z-10">
          <div>
            <div className="text-xs uppercase tracking-wider text-ink-3 font-semibold">Atividade</div>
            <div className="text-base font-bold">{items.length} eventos recentes</div>
          </div>
          <IconButton icon="x" onClick={onClose} />
        </div>
        <div className="p-4">
          {items.length === 0 ? (
            <p className="text-sm text-ink-3 italic text-center py-10">Nada por aqui ainda. Toda mudança aparece nesse feed.</p>
          ) : (
            <ol className="space-y-3">
              {items.map(it => {
                const m = byUser(it.actorId);
                const ic = iconFor(it.kind, it.entityType);
                return (
                  <li key={it.id} className="flex items-start gap-3">
                    <div className="relative flex-shrink-0">
                      {m?.avatarUrl
                        ? <img src={m.avatarUrl} className="w-8 h-8 rounded-full object-cover" alt="" />
                        : <span className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{background: m?.color || 'var(--ink-2)'}}>{(m?.name?.[0] || m?.email?.[0] || '?').toUpperCase()}</span>
                      }
                      <span className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center border-2 border-paper" style={{background: ic.color, color: 'white'}}>
                        <Icon name={ic.name} size={10} />
                      </span>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm text-ink-2">{it.summary}</div>
                      <div className="text-[11px] text-ink-4 mt-0.5">{new Date(it.at).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                  </li>
                );
              })}
            </ol>
          )}
        </div>
      </aside>
    </div>,
    document.body
  );
}

    { label: 'Editar viagem',              icon: 'edit',      onClick: onEdit },
    { label: 'Configurações',              icon: 'settings',  onClick: onSettings },
  ];

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(v => !v)} className="p-2 border border-rule-2 rounded-lg hover:border-ink hover:bg-paper-2 transition-colors" title="Mais ações">
        <Icon name="menu" size={16} />
      </button>
      {open && (
        <div className="absolute right-0 top-full mt-2 min-w-[220px] bg-paper border border-rule rounded-xl overflow-hidden shadow-lg z-50" style={{boxShadow: 'var(--shadow-lg)'}}>
          {items.map((it, i) => it.divider
            ? <div key={i} className="border-t border-rule my-1"></div>
            : <button key={i} onClick={() => { setOpen(false); it.onClick(); }} className="w-full text-left px-4 py-2.5 hover:bg-paper-2 flex items-center gap-3 text-sm">
                <Icon name={it.icon} size={14} className="text-ink-3" />
                <span>{it.label}</span>
              </button>
          )}
        </div>
      )}
    </div>
  );
}

function TripHeader({ trip, daysToGo }) {
  const [editing, setEditing] = useState(false);
  const [settings, setSettings] = useState(false);
  const [members, setMembers] = useState(false);
  const [activityOpen, setActivityOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  // Contador de atividades "não lidas" (aproximação: nova desde ultima visita)
  const lastSeenKey = `activity_seen_${trip.id}`;
  const [lastSeen, setLastSeen] = useState(() => {
    try { return parseInt(localStorage.getItem(lastSeenKey) || '0'); } catch { return 0; }
  });
  const unseenCount = (trip.activity || []).filter(a => new Date(a.at).getTime() > lastSeen).length;
  const openActivity = () => {
    setActivityOpen(true);
    const now = Date.now();
    setLastSeen(now);
    try { localStorage.setItem(lastSeenKey, String(now)); } catch {}
  };
  const nDays = daysBetween(trip.startDate, trip.endDate) + 1;
  const status = tripStatusChip(trip);

  const share = async () => {
    const url = makeShareableUrl(trip);
    if (!url) { toast.error('Erro ao gerar link.'); return; }
    if (url.length > 8000) {
      const ok = confirm(`O link ficou grande (${(url.length/1024).toFixed(1)}KB). Alguns apps podem cortar. Copiar mesmo assim?`);
      if (!ok) return;
    }
    try {
      await navigator.clipboard.writeText(url);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch { prompt('Copie o link:', url); }
  };

  const printPage = () => window.print();

  const exportTrip = () => {
    const blob = new Blob([JSON.stringify(trip, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${trip.name.replace(/[^\w-]+/g,'_').toLowerCase()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="relative fade-in">
      <div className="flex items-start justify-between gap-4 mb-6 flex-wrap">
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-2 flex-wrap mb-3">
            <span className="text-xs font-semibold text-ink-3 uppercase tracking-wider">{trip.destination || 'Sem destino'}</span>
            <span className={cx('chip', status.cls)}>{status.text}</span>
          </div>
          <h1 className="text-3xl sm:text-4xl lg:text-5xl font-bold text-ink leading-tight tracking-tight">{trip.name}</h1>
          <div className="mt-3 flex items-center gap-4 text-sm text-ink-2 flex-wrap">
            <span className="flex items-center gap-1.5"><Icon name="calendar" size={14} className="text-ink-3" />{fmtDate(trip.startDate)} → {fmtDate(trip.endDate, { year: true })}</span>
            <span className="w-1 h-1 rounded-full bg-ink-4"></span>
            <span>{nDays} {nDays === 1 ? 'dia' : 'dias'}</span>
            {daysToGo > 0 && daysToGo <= 120 && (
              <>
                <span className="w-1 h-1 rounded-full bg-ink-4"></span>
                <span className="text-accent font-semibold">em {daysToGo} {daysToGo === 1 ? 'dia' : 'dias'}</span>
              </>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2 no-print flex-shrink-0">
          <MembersAvatars trip={trip} onClick={() => setMembers(true)} />
          <button onClick={openActivity} className="btn btn-ghost btn-icon relative" title="Atividade recente">
            <Icon name="clock" size={16} />
            {unseenCount > 0 && <span className="absolute -top-1 -right-1 min-w-4 h-4 rounded-full bg-accent text-white text-[9px] font-bold flex items-center justify-center px-1">{unseenCount > 9 ? '9+' : unseenCount}</span>}
          </button>
          <Button variant="accent" size="sm" icon="users" onClick={() => setMembers(true)}>
            <span className="hidden sm:inline">Convidar</span>
          </Button>
          <TripActionsMenu
            onShare={share} onExport={exportTrip} onPrint={printPage}
            onEdit={() => setEditing(true)} onSettings={() => setSettings(true)}
            copied={copied}
          />
        </div>
      </div>

      {copied && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-5 py-3 z-50 fade-in font-medium rounded-lg" style={{boxShadow:'var(--shadow-lg)'}}>Link copiado ✓</div>}

      <TripEditModal open={editing} onClose={() => setEditing(false)} trip={trip} />
      <TripSettingsModal open={settings} onClose={() => setSettings(false)} trip={trip} />
      <MembersModal open={members} onClose={() => setMembers(false)} trip={trip} />
      <ActivityDrawer trip={trip} open={activityOpen} onClose={() => setActivityOpen(false)} />
    </div>
  );
}

function MembersAvatars({ trip, onClick }) {
  const { user, profile } = useAuth();
  const me = user ? { userId: user.id, name: profile?.full_name || user.email } : null;
  const online = useTripPresence(trip.id, me);
  const list = (trip.members || []).slice(0, 4);
  if (list.length === 0) return null;
  const onlineCount = Object.keys(online).length;
  return (
    <button onClick={onClick} className="flex -space-x-2 items-center hover:opacity-80 transition-opacity relative" title={`${onlineCount} online agora`}>
      {list.map(m => (
        <span key={m.userId} className="relative">
          {m.avatarUrl
            ? <img src={m.avatarUrl} alt="" className="w-8 h-8 rounded-full border-2 border-paper object-cover" />
            : <span className="w-8 h-8 rounded-full border-2 border-paper flex items-center justify-center text-white text-xs font-bold" style={{background: m.color || 'var(--ink-2)'}}>{(m.name?.[0] || m.email?.[0] || '?').toUpperCase()}</span>
          }
          {online[m.userId] && (
            <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-paper bg-ok" title="online"></span>
          )}
        </span>
      ))}
      {(trip.members?.length || 0) > 4 && <span className="w-8 h-8 rounded-full border-2 border-paper bg-paper-2 flex items-center justify-center text-[10px] font-bold text-ink-3">+{trip.members.length - 4}</span>}
    </button>
  );
}

function MembersModal({ open, onClose, trip }) {
  const { user, profile } = useAuth();
  const { refetchActive, myContacts } = useStore();
  const me = user ? { userId: user.id, name: profile?.full_name || user.email } : null;
  const online = useTripPresence(open ? trip.id : null, me);
  const [email, setEmail] = useState('');
  const [role, setRole] = useState('editor');
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [copiedToken, setCopiedToken] = useState(null);

  const isOwner = trip.ownerId === user?.id;
  const memberEmails = new Set((trip.members || []).map(m => m.email?.toLowerCase()).filter(Boolean));
  const invitedEmails = new Set(invites.map(i => i.invited_email?.toLowerCase()).filter(Boolean));
  const suggestedContacts = (myContacts || []).filter(c =>
    c.email && !memberEmails.has(c.email.toLowerCase()) && !invitedEmails.has(c.email.toLowerCase())
  );

  const loadInvites = useCallback(async () => {
    if (!open || !isOwner) return;
    const { data } = await SB.from('trip_invites').select('*').eq('trip_id', trip.id).eq('accepted', false).order('created_at', { ascending: false });
    setInvites(data || []);
  }, [open, isOwner, trip.id]);

  useEffect(() => { loadInvites(); }, [loadInvites]);

  const doInvite = async (targetEmail, targetRole = role) => {
    const em = (targetEmail || '').trim().toLowerCase();
    if (!em) return;
    if (memberEmails.has(em)) { setError('Essa pessoa já é membro.'); return; }
    setLoading(true); setError('');
    try {
      const { error } = await SB.from('trip_invites').insert({
        trip_id: trip.id, invited_email: em, role: targetRole, invited_by: user.id,
      });
      if (error) throw error;
      setEmail('');
      await loadInvites();
      toast.success(`Convite enviado para ${em}`);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  const invite = async (e) => {
    e.preventDefault();
    await doInvite(email);
  };

  const revoke = async (id) => {
    if (!confirm('Cancelar este convite?')) return;
    await SB.from('trip_invites').delete().eq('id', id);
    loadInvites();
  };

  const removeMember = async (userId) => {
    if (!confirm('Remover essa pessoa da viagem?')) return;
    await SB.from('trip_members').delete().eq('trip_id', trip.id).eq('user_id', userId);
    refetchActive();
  };

  const copyInviteLink = async (token) => {
    const url = `${window.location.origin}${window.location.pathname}?invite=${token}`;
    try {
      await navigator.clipboard.writeText(url);
      setCopiedToken(token);
      setTimeout(() => setCopiedToken(null), 2000);
    } catch { prompt('Copie o link:', url); }
  };

  return (
    <Modal open={open} onClose={onClose} title="Membros da viagem" size="md"
      footer={<Button onClick={onClose}>Fechar</Button>}>
      <div className="space-y-6">
        <div>
          <div className="text-xs uppercase tracking-wider text-ink-3 font-semibold mb-3">Membros ({trip.members?.length || 0})</div>
          <div className="space-y-2">
            {(trip.members || []).map(m => (
              <div key={m.userId} className="flex items-center gap-3 p-3 rounded-lg border border-rule">
                <span className="relative">
                  {m.avatarUrl
                    ? <img src={m.avatarUrl} className="w-9 h-9 rounded-full object-cover" alt="" />
                    : <span className="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold" style={{background: m.color || 'var(--ink-2)'}}>{(m.name?.[0] || m.email?.[0] || '?').toUpperCase()}</span>
                  }
                  {online[m.userId] && <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-paper bg-ok"></span>}
                </span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold truncate">{m.name || m.email} {online[m.userId] && <span className="text-[10px] text-ok font-mono ml-1">online</span>}</div>
                  <div className="text-xs text-ink-3 truncate">{m.email}</div>
                </div>
                <span className={cx('chip', m.role === 'owner' ? 'chip-accent' : 'chip')}>{m.role === 'owner' ? 'Dono' : m.role === 'viewer' ? 'Leitor' : 'Editor'}</span>
                {isOwner && m.role !== 'owner' && (
                  <IconButton icon="trash" onClick={() => removeMember(m.userId)} title="Remover" />
                )}
              </div>
            ))}
          </div>
        </div>

        {isOwner && (
          <>
            <div className="border-t border-rule pt-5">
              <div className="text-xs uppercase tracking-wider text-ink-3 font-semibold mb-3">Convidar novo membro</div>
              <form onSubmit={invite} className="grid grid-cols-1 sm:grid-cols-[1fr_auto_auto] gap-2">
                <TextInput type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="email@exemplo.com" required />
                <Select value={role} onChange={e => setRole(e.target.value)}>
                  <option value="editor">Editor</option>
                  <option value="viewer">Leitor</option>
                </Select>
                <Button type="submit" variant="primary" disabled={loading}>Convidar</Button>
              </form>
              {error && <div className="text-xs text-bad mt-2">{error}</div>}
              <p className="text-xs text-ink-3 mt-2">A pessoa entra com esse email e acessa a viagem automaticamente. Se ela não tem conta, também pode compartilhar o link do convite abaixo.</p>

              {suggestedContacts.length > 0 && (
                <div className="mt-5">
                  <div className="text-[11px] uppercase tracking-wider text-ink-3 font-semibold mb-2">Já viajou com você</div>
                  <div className="flex flex-wrap gap-2">
                    {suggestedContacts.map(c => (
                      <button key={c.userId} onClick={() => doInvite(c.email)}
                        className="group flex items-center gap-2 pl-1 pr-3 py-1 border border-rule rounded-full hover:border-ink hover:bg-paper-2 transition-colors disabled:opacity-40"
                        disabled={loading}
                        title={`Convidar ${c.email}`}>
                        {c.avatarUrl
                          ? <img src={c.avatarUrl} className="w-6 h-6 rounded-full object-cover" alt="" />
                          : <span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background: c.color || 'var(--ink-2)'}}>{(c.name?.[0] || c.email?.[0] || '?').toUpperCase()}</span>
                        }
                        <span className="text-sm font-medium">{c.name || c.email}</span>
                        <Icon name="plus" size={12} className="text-ink-3 group-hover:text-ink" />
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {invites.length > 0 && (
              <div className="border-t border-rule pt-5">
                <div className="text-xs uppercase tracking-wider text-ink-3 font-semibold mb-3">Convites pendentes ({invites.length})</div>
                <div className="space-y-2">
                  {invites.map(i => (
                    <div key={i.id} className="flex items-center gap-3 p-3 rounded-lg border border-rule bg-paper-2">
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-semibold truncate">{i.invited_email}</div>
                        <div className="text-xs text-ink-3 mt-0.5">Role: {i.role} · expira {fmtDate(i.expires_at?.slice(0,10))}</div>
                      </div>
                      <Button size="xs" onClick={() => copyInviteLink(i.token)}>
                        {copiedToken === i.token ? '✓ copiado' : 'Copiar link'}
                      </Button>
                      <IconButton icon="trash" onClick={() => revoke(i.id)} title="Cancelar convite" />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </Modal>
  );
}

function TripEditModal({ open, onClose, trip }) {
  const { updateTrip } = useStore();
  const [f, setF] = useState(trip);
  useEffect(() => { if (open) setF(trip); }, [open, trip]);
  const save = () => {
    updateTrip(trip.id, t => ({ ...t, name: f.name, destination: f.destination, startDate: f.startDate, endDate: f.endDate, budgetCeiling: Number(f.budgetCeiling) || 0 }));
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Editar viagem" size="md"
      footer={<><Button onClick={onClose}>Cancelar</Button><Button variant="primary" onClick={save}>Salvar</Button></>}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div className="sm:col-span-2"><Label>Nome</Label><TextInput value={f.name} onChange={e => setF({...f, name: e.target.value})} /></div>
        <div className="sm:col-span-2"><Label>Destino</Label><TextInput value={f.destination} onChange={e => setF({...f, destination: e.target.value})} /></div>
        <div><Label>Ida</Label><TextInput type="date" value={f.startDate} onChange={e => setF({...f, startDate: e.target.value})} /></div>
        <div><Label>Volta</Label><TextInput type="date" value={f.endDate} onChange={e => setF({...f, endDate: e.target.value})} /></div>
        <div className="sm:col-span-2"><Label>Teto de orçamento</Label><CurrencyInput value={f.budgetCeiling} onChange={e => setF({...f, budgetCeiling: e.target.value})} currency={f.baseCurrency} /></div>
      </div>
    </Modal>
  );
}

function TripSettingsModal({ open, onClose, trip }) {
  const { updateTrip } = useStore();
  const [f, setF] = useState(trip);
  useEffect(() => { if (open) setF(trip); }, [open, trip]);
  const save = () => {
    updateTrip(trip.id, t => ({ ...t, baseCurrency: f.baseCurrency, secondaryCurrencies: f.secondaryCurrencies, travelers: f.travelers }));
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Configurações da viagem" size="lg"
      footer={<><Button onClick={onClose}>Cancelar</Button><Button variant="primary" onClick={save}>Salvar</Button></>}>
      <div className="space-y-5">
        <div>
          <Label>Moeda base</Label>
          <Select value={f.baseCurrency} onChange={e => setF({ ...f, baseCurrency: e.target.value, secondaryCurrencies: f.secondaryCurrencies.filter(c => c !== e.target.value) })}>
            {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.code} — {c.name}</option>)}
          </Select>
        </div>
        <div>
          <Label>Moedas secundárias</Label>
          <div className="flex flex-wrap gap-1.5">
            {CURRENCIES.filter(c => c.code !== f.baseCurrency).map(c => {
              const on = f.secondaryCurrencies.includes(c.code);
              return (
                <button key={c.code} onClick={() => setF({ ...f, secondaryCurrencies: on ? f.secondaryCurrencies.filter(x => x !== c.code) : [...f.secondaryCurrencies, c.code] })}
                  className={cx('chip', on ? 'chip-ink' : '')}>{c.code}</button>
              );
            })}
          </div>
        </div>

        <div className="hairline pt-4">
          <div className="flex items-center justify-between mb-2">
            <Label className="mb-0">Companheiros de viagem</Label>
            <Button size="xs" icon="plus" onClick={() => setF({ ...f, travelers: [...f.travelers, { id: uid('t_'), name: '', color: CATEGORY_COLORS[f.travelers.length % CATEGORY_COLORS.length] }] })}>Adicionar</Button>
          </div>
          {f.travelers.length === 0 && <p className="text-xs text-inkm">Adicione quem vai junto para dividir despesas.</p>}
          <div className="space-y-2">
            {f.travelers.map((t, i) => (
              <div key={t.id} className="flex items-center gap-2">
                <input type="color" value={t.color} onChange={e => setF({ ...f, travelers: f.travelers.map(x => x.id === t.id ? { ...x, color: e.target.value } : x) })} className="w-8 h-8 rounded border border-line cursor-pointer" />
                <TextInput className="flex-1" value={t.name} onChange={e => setF({ ...f, travelers: f.travelers.map(x => x.id === t.id ? { ...x, name: e.target.value } : x) })} placeholder="Nome" />
                <IconButton icon="trash" onClick={() => setF({ ...f, travelers: f.travelers.filter(x => x.id !== t.id) })} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </Modal>
  );
}

function DashboardTab({ trip, fx, onGo }) {
  const spent = computeSpent(trip, fx);
  const budgetedTotal = trip.categories.reduce((s, c) => s + Number(c.budgeted || 0), 0);
  const pctSpent = trip.budgetCeiling ? Math.round((spent / trip.budgetCeiling) * 100) : 0;
  const daysUntil = daysBetween(isoToday(), trip.startDate);
  const pendingCritical = trip.checklist.filter(c => !c.done && c.critical).length;
  const pendingSoon = trip.checklist.filter(c => !c.done && c.deadline).sort((a,b) => a.deadline.localeCompare(b.deadline)).slice(0,3);
  const nextDays = trip.days.filter(d => d.date >= isoToday()).slice(0, 3);

  const remaining = trip.budgetCeiling - spent;

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <StatCard label="Contagem" value={daysUntil > 0 ? `T-${daysUntil}` : (trip.endDate < isoToday() ? '—' : 'AGORA')} sub={daysUntil > 0 ? 'dias para embarcar' : trip.endDate < isoToday() ? 'concluída' : 'em curso'} tone={daysUntil <= 30 && daysUntil >= 0 ? 'accent' : 'ink'} accent={daysUntil <= 30 && daysUntil >= 0} />
        <StatCard label="Gasto" value={fmtMoneyCompact(spent, trip.baseCurrency)} sub={trip.budgetCeiling ? `${pctSpent}% do teto` : 'sem teto'} tone={pctSpent > 100 ? 'bad' : pctSpent > 80 ? 'warn' : 'ink'} />
        <StatCard label="Orçado" value={fmtMoneyCompact(budgetedTotal, trip.baseCurrency)} sub="soma das categorias" />
        <StatCard label="Pendências" value={trip.checklist.filter(c => !c.done).length} sub={pendingCritical ? `${pendingCritical} críticas` : 'sem urgência'} tone={pendingCritical ? 'bad' : 'ok'} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 space-y-5">
          {trip.budgetCeiling > 0 && (
            <div className="card p-5 sm:p-6 fade-in-2">
              <div className="flex items-baseline justify-between mb-4">
                <div>
                  <div className="text-[9px] font-semibold uppercase tracking-wider text-ink-4">Ledger · orçamento</div>
                  <h3 className="font-bold text-2xl mt-0.5">Onde o dinheiro vai</h3>
                </div>
                <Button size="xs" onClick={() => onGo('budget')}>Detalhar →</Button>
              </div>
              <div className="flex items-end justify-between mb-2 gap-4">
                <div>
                  <div className="text-[9px] font-semibold uppercase tracking-wider text-ink-4">Gasto</div>
                  <div className="font-bold text-5xl leading-none num" style={{fontVariationSettings:"'opsz' 144, 'SOFT' 100"}}>{fmtMoney(spent, trip.baseCurrency, { digits: 0 })}</div>
                </div>
                <div className="text-right">
                  <div className="text-[9px] font-semibold uppercase tracking-wider text-ink-4">Sobra</div>
                  <div className={cx('font-bold text-2xl num', remaining < 0 ? 'text-bad' : 'text-ok')}>{fmtMoney(remaining, trip.baseCurrency, { digits: 0 })}</div>
                  <div className="text-[10px] text-ink-3">de {fmtMoneyCompact(trip.budgetCeiling, trip.baseCurrency)}</div>
                </div>
              </div>
              <div className="h-2 bg-paper relative overflow-hidden">
                <div className="h-full transition-all" style={{width: `${Math.min(100, pctSpent)}%`, background: spent > trip.budgetCeiling ? 'var(--bad)' : spent > trip.budgetCeiling * 0.8 ? 'var(--warn)' : 'var(--ink)'}}></div>
              </div>
              <div className="mt-5 space-y-3">
                {trip.categories.map(c => {
                  const sp = spentByCategory(trip, c.id, fx);
                  const b = Number(c.budgeted || 0);
                  const over = b > 0 && sp > b;
                  return (
                    <div key={c.id}>

function WeatherCard({ trip }) {
  const [wx, setWx] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!trip.mapPoints || !trip.mapPoints.length) return;
    const p = trip.mapPoints[0];
    // Buscar clima só se viagem for nos próximos 16 dias (limite Open-Meteo)
    const today = new Date().toISOString().slice(0,10);
    const start = trip.startDate < today ? today : trip.startDate;
    const daysAhead = daysBetween(today, start);
    if (daysAhead > 16) return;
    const end = trip.endDate < today ? today : trip.endDate;
    setLoading(true);
    fetchWeather(p.lat, p.lon, start, end.slice(0,10)).then(d => { setWx(d); setLoading(false); });
  }, [trip.startDate, trip.endDate, trip.mapPoints]);

  if (!trip.mapPoints || !trip.mapPoints.length) return null;
  const daysAhead = daysBetween(isoToday(), trip.startDate);
  if (daysAhead > 16) {
    return (
      <div className="card p-5">
        <h3 className="text-sm font-semibold text-ink mb-1">Clima</h3>
        <p className="text-xs text-inkm">Previsão disponível 16 dias antes da viagem (faltam {daysAhead}).</p>
      </div>
    );
  }
  if (loading) return <div className="card p-5"><h3 className="text-sm font-semibold text-ink mb-1">Clima</h3><p className="text-xs text-inkm">Carregando…</p></div>;
  if (!wx || !wx.daily) return null;

  return (
    <div className="card p-5">
      <h3 className="text-sm font-semibold text-ink mb-2">Clima em {trip.mapPoints[0].name}</h3>
      <div className="space-y-1.5">
        {wx.daily.time.slice(0, 6).map((d, i) => (
          <div key={d} className="flex items-center justify-between text-xs">
            <span className="text-inkm">{fmtDate(d)}</span>
            <span className="num">{Math.round(wx.daily.temperature_2m_min[i])}° / <span className="text-ink font-medium">{Math.round(wx.daily.temperature_2m_max[i])}°</span></span>
          </div>
        ))}
      </div>
    </div>
  );
}

function computeSpent(trip, fx) {
  if (!trip || !Array.isArray(trip.days)) return 0;
  let total = 0;
  trip.days.forEach(d => (d.blocks || []).forEach(b => {
    if (b.cost != null) {
      const cc = b.currency || trip.baseCurrency;
      if (cc === trip.baseCurrency) total += Number(b.cost);
      else if (fx?.rates) {
        const conv = convert(Number(b.cost), cc, trip.baseCurrency, fx.rates);
        if (conv != null) total += conv;
      } else {
        // fallback: soma sem converter (grosseiro)
        total += Number(b.cost);
      }
    }
  }));
  return total;
}

function spentByCategory(trip, catId, fx) {
  if (!trip || !Array.isArray(trip.days)) return 0;
  let total = 0;
  trip.days.forEach(d => (d.blocks || []).forEach(b => {
    if (b.categoryId === catId && b.cost != null) {
      const cc = b.currency || trip.baseCurrency;
      if (cc === trip.baseCurrency) total += Number(b.cost);
      else if (fx?.rates) {
        const conv = convert(Number(b.cost), cc, trip.baseCurrency, fx.rates);
        if (conv != null) total += conv;
      } else total += Number(b.cost);
    }
  }));
  return total;
}

function DonutChart({ data, title }) {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  const size = 160; const stroke = 24; const r = (size - stroke) / 2; const cx = size / 2; const cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div className="card p-5">
      <h3 className="text-sm font-semibold text-ink mb-3">{title}</h3>
      {total === 0 ? <p className="text-xs text-inkm">Sem gastos registrados ainda.</p> : (
        <div className="flex items-center gap-4">
          <svg width={size} height={size} className="flex-shrink-0">
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#F5F5F4" strokeWidth={stroke} />
            {data.map((d, i) => {
              if (d.value <= 0) return null;
              const frac = d.value / total;
              const len = frac * circ;
              const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth={stroke} strokeDasharray={`${len} ${circ - len}`} strokeDashoffset={-offset} transform={`rotate(-90 ${cx} ${cy})`} />;
              offset += len;
              return el;
            })}
            <text x={cx} y={cy - 4} textAnchor="middle" className="fill-inkm text-[10px] uppercase tracking-wider">Total</text>
            <text x={cx} y={cy + 12} textAnchor="middle" className="fill-ink font-semibold text-sm num">{fmtMoneyCompact(total)}</text>
          </svg>
          <ul className="text-xs space-y-1 flex-1 min-w-0">
            {data.filter(d => d.value > 0).sort((a,b) => b.value - a.value).slice(0, 8).map((d, i) => (
              <li key={i} className="flex items-center justify-between gap-2">
                <span className="flex items-center gap-1.5 min-w-0"><span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: d.color}} /><span className="truncate">{d.label}</span></span>
                <span className="num text-inkm">{Math.round((d.value/total)*100)}%</span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

function MapTab({ trip }) {
  const { updateTrip } = useStore();
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersLayer = useRef(null);
  const [adding, setAdding] = useState(false);
  const [tilesFailing, setTilesFailing] = useState(false);

  useEffect(() => {
    if (!window.L || !mapRef.current || mapInstance.current) return;
    const map = window.L.map(mapRef.current, { zoomControl: true, attributionControl: false }).setView([-15, -55], 3);

    // OpenStreetMap standard — sem watermark, sem key. Attribution obrigatorio.
    window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      crossOrigin: true,
    }).addTo(map);

    window.L.control.attribution({ prefix: false }).addAttribution('© OpenStreetMap contributors').addTo(map);
    mapInstance.current = map;
    markersLayer.current = window.L.layerGroup().addTo(map);

    // Força invalidateSize logo depois da mount (resolve container 0x0)
    setTimeout(() => map.invalidateSize(), 100);
    setTimeout(() => map.invalidateSize(), 500);

    // Observa resize do container
    let ro;
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(() => map.invalidateSize());
      ro.observe(mapRef.current);
    }

    return () => {
      if (ro) ro.disconnect();
      map.remove();
      mapInstance.current = null;
    };
  }, []);

  useEffect(() => {
    if (!mapInstance.current || !markersLayer.current) return;
    markersLayer.current.clearLayers();
    const pts = trip.mapPoints || [];
    const options = (trip.options || []).filter(o => o.lat != null && o.lon != null && o.status !== 'discarded');

    pts.forEach((p, i) => {
      const icon = window.L.divIcon({ className: '', html: `<div class="tp-marker">${i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
      const m = window.L.marker([p.lat, p.lon], { icon }).addTo(markersLayer.current);
      m.bindPopup(`<div style="font-family:'Plus Jakarta Sans',sans-serif"><div style="font-weight:700;font-size:13px">${p.name}</div>${p.note ? `<div style="font-size:11px;color:#717171;margin-top:2px">${p.note}</div>` : ''}</div>`);
    });

    options.forEach(o => {
      const typeInfo = OPTION_TYPES.find(t => t.id === o.type) || OPTION_TYPES[5];
      const color = o.status === 'booked' ? '#008A05' : o.status === 'preferred' ? '#FF385C' : '#717171';
      const icon = window.L.divIcon({
        className: '',
        html: `<div style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:white;border:2px solid ${color};border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.2);font-size:16px">${typeInfo.emoji}</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16],
      });
      const m = window.L.marker([o.lat, o.lon], { icon }).addTo(markersLayer.current);
      const price = o.price != null ? `${fmtMoney(o.price, o.currency || trip.baseCurrency)}${o.priceUnit ? ' / ' + o.priceUnit : ''}` : '';
      m.bindPopup(`<div style="font-family:'Plus Jakarta Sans',sans-serif"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:#717171;font-weight:600">${typeInfo.emoji} ${typeInfo.label}</div><div style="font-weight:700;font-size:14px;margin-top:2px">${o.name}</div>${o.location ? `<div style="font-size:11px;color:#717171;margin-top:2px">📍 ${o.location}</div>` : ''}${price ? `<div style="font-size:12px;margin-top:4px;font-weight:600">${price}</div>` : ''}</div>`);
    });

    const allPts = [...pts, ...options];
    if (pts.length > 1) {
      const poly = window.L.polyline(pts.map(p => [p.lat, p.lon]), { color: '#222', weight: 2, dashArray: '4 4', opacity: 0.5 }).addTo(markersLayer.current);
      mapInstance.current.fitBounds(poly.getBounds(), { padding: [50, 50] });
    } else if (allPts.length > 1) {
      mapInstance.current.fitBounds(window.L.latLngBounds(allPts.map(p => [p.lat, p.lon])), { padding: [50, 50] });
    } else if (allPts.length === 1) {
      mapInstance.current.setView([allPts[0].lat, allPts[0].lon], 12);
    }
  }, [trip.mapPoints, trip.options]);

  const removePoint = (id) => updateTrip(trip.id, t => ({ ...t, mapPoints: t.mapPoints.filter(p => p.id !== id) }));
  const movePoint = (id, dir) => updateTrip(trip.id, t => {
    const idx = t.mapPoints.findIndex(p => p.id === id);
    if (idx < 0) return t;
    const to = idx + dir;
    if (to < 0 || to >= t.mapPoints.length) return t;
    const arr = [...t.mapPoints]; [arr[idx], arr[to]] = [arr[to], arr[idx]];
    return { ...t, mapPoints: arr };
  });

  return (
    <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
      <div className="lg:col-span-3">
        <div ref={mapRef} className="rounded-lg border border-rule bg-paper-2" style={{ height: 480, minHeight: 480 }}></div>
      </div>
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-sm font-semibold text-ink">Pontos ({trip.mapPoints.length})</h3>
          <Button size="sm" icon="plus" onClick={() => setAdding(true)}>Adicionar</Button>
        </div>
        {trip.mapPoints.length === 0 ? (
          <p className="text-xs text-inkm">Adicione destinos, pernoites ou atividades para desenhar a rota.</p>
        ) : (
          <ol className="space-y-2">
            {trip.mapPoints.map((p, i) => (
              <li key={p.id} className="flex items-start gap-2 group">
                <div className="w-6 h-6 rounded-full bg-ink text-white flex items-center justify-center text-[11px] font-semibold flex-shrink-0">{i + 1}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-ink truncate">{p.name}</div>
                  {p.note && <div className="text-xs text-inkm truncate">{p.note}</div>}
                  <div className="text-[10px] text-inks num mt-0.5">{p.lat.toFixed(3)}, {p.lon.toFixed(3)}</div>
                </div>
                <div className="opacity-0 group-hover:opacity-100 flex flex-col">
                  <IconButton icon="chevronUp" onClick={() => movePoint(p.id, -1)} />
                  <IconButton icon="chevronDown" onClick={() => movePoint(p.id, 1)} />
                </div>
                <IconButton icon="trash" onClick={() => removePoint(p.id)} />
              </li>
            ))}
          </ol>
        )}
      </div>

      {adding && <AddPointModal trip={trip} onClose={() => setAdding(false)} />}
    </div>
  );
}

function AddPointModal({ trip, onClose }) {
  const { updateTrip } = useStore();
  const [q, setQ] = useState('');
  const [note, setNote] = useState('');
  const [manual, setManual] = useState(false);
  const [lat, setLat] = useState(''); const [lon, setLon] = useState('');
  const [searching, setSearching] = useState(false);
  const [error, setError] = useState('');

  const doSearch = async () => {
    if (!q.trim()) return;
    setSearching(true); setError('');
    const r = await geocode(q.trim());
    setSearching(false);
    if (!r) { setError('Não encontrei essa localização. Tente ser mais específico ou insira as coordenadas manualmente.'); return; }
    updateTrip(trip.id, t => ({ ...t, mapPoints: [...t.mapPoints, { id: uid('m_'), name: q.trim(), lat: r.lat, lon: r.lon, note, kind: 'point' }] }));
    onClose();
  };
  const doManual = () => {
    const la = parseFloat(lat), lo = parseFloat(lon);
    if (isNaN(la) || isNaN(lo)) { setError('Coordenadas inválidas.'); return; }

function SplitTab({ trip, fx }) {
  if (trip.travelers.length === 0) {
    return <EmptyState icon="users" title="Nenhum companheiro cadastrado" description="Adicione companheiros nas configurações da viagem para dividir despesas." />;
  }

  // Compute balances
  const balances = {}; // travelerId -> amount pago menos deveria pagar
  trip.travelers.forEach(t => balances[t.id] = 0);
  const rows = [];

  trip.days.forEach(d => d.blocks.forEach(b => {
    if (b.cost == null || !b.paidBy) return;
    const cc = b.currency || trip.baseCurrency;
    let amount = Number(b.cost);
    if (cc !== trip.baseCurrency && fx?.rates) {
      const v = convert(amount, cc, trip.baseCurrency, fx.rates);
      if (v == null) return;
      amount = v;
    }
    const split = (b.splitBetween && b.splitBetween.length) ? b.splitBetween : trip.travelers.map(t => t.id);
    const share = amount / split.length;
    balances[b.paidBy] = (balances[b.paidBy] || 0) + amount;
    split.forEach(id => { balances[id] = (balances[id] || 0) - share; });
    rows.push({ dayDate: d.date, block: b, amount, payer: b.paidBy, splitBetween: split, share });
  }));

  // Settle balances
  const settlements = settleBalances(balances);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div className="card p-5">
        <h3 className="text-sm font-semibold text-ink mb-3">Balanço</h3>
        <ul className="space-y-2 mb-4">
          {trip.travelers.map(t => (
            <li key={t.id} className="flex items-center justify-between">
              <span className="flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{background: t.color}} />{t.name || 'sem nome'}</span>
              <span className={cx('num font-medium', balances[t.id] > 0.5 ? 'text-ok' : balances[t.id] < -0.5 ? 'text-bad' : 'text-inkm')}>{fmtMoney(balances[t.id], trip.baseCurrency)}</span>
            </li>
          ))}
        </ul>
        <div className="hairline pt-4">
          <h4 className="text-xs uppercase tracking-widest text-inkm mb-2">Como acertar</h4>
          {settlements.length === 0 ? <p className="text-sm text-inkm">Nada a acertar 👍</p> : (
            <ul className="space-y-1.5">
              {settlements.map((s, i) => {
                const from = trip.travelers.find(t => t.id === s.from);
                const to = trip.travelers.find(t => t.id === s.to);
                return (
                  <li key={i} className="text-sm flex items-center gap-2">
                    <span className="font-medium">{from?.name}</span>
                    <Icon name="chevronRight" size={12} className="text-inkm" />
                    <span className="font-medium">{to?.name}</span>
                    <span className="ml-auto num">{fmtMoney(s.amount, trip.baseCurrency)}</span>
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      </div>

      <div className="card p-5">
        <h3 className="text-sm font-semibold text-ink mb-3">Despesas divididas ({rows.length})</h3>
        {rows.length === 0 ? <p className="text-xs text-inkm">Marque "quem pagou" nos blocos do roteiro para começar a dividir.</p> : (
          <ul className="space-y-2 max-h-[500px] overflow-y-auto">
            {rows.slice().reverse().map((r, i) => {
              const p = trip.travelers.find(t => t.id === r.payer);
              return (
                <li key={i} className="text-xs border-l-2 pl-2 py-0.5" style={{borderColor: p?.color || '#0A0A0A'}}>
                  <div className="flex items-center justify-between">
                    <span className="text-ink font-medium truncate">{r.block.title || 'sem título'}</span>
                    <span className="num">{fmtMoney(r.amount, trip.baseCurrency)}</span>
                  </div>
                  <div className="text-inkm">
                    {fmtDate(r.dayDate)} · pagou {p?.name} · {r.splitBetween.length}p · <span className="num">{fmtMoney(r.share, trip.baseCurrency)} cada</span>
                  </div>
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

function settleBalances(balances) {
  const arr = Object.entries(balances).map(([id, amt]) => ({ id, amt }));
  const debtors = arr.filter(a => a.amt < -0.5).sort((a,b) => a.amt - b.amt);
  const creditors = arr.filter(a => a.amt > 0.5).sort((a,b) => b.amt - a.amt);
  const out = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(-debtors[i].amt, creditors[j].amt);
    out.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
    debtors[i].amt += pay;
    creditors[j].amt -= pay;
    if (Math.abs(debtors[i].amt) < 0.5) i++;
    if (Math.abs(creditors[j].amt) < 0.5) j++;
  }
  return out;
}
