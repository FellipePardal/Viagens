<style>
  :root {
    /* shadcn/ui zinc palette (light) */

    --ink-2: #18181B;
    --ink-3: #71717A;
    --ink-4: #A1A1AA;

    --warn: #CA8A04;

    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);

    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
  }
  html[data-theme="dark"] :root,
  html[data-theme="dark"] body,
  :root[data-theme="dark"] {
    /* shadcn/ui zinc palette (dark) */
    --paper: #09090B;
    --paper-2: #18181B;
    --paper-3: #27272A;
    --ink: #FAFAFA;
    --ink-2: #E4E4E7;
    --ink-3: #A1A1AA;
    --ink-4: #71717A;
    --rule: #27272A;
    --rule-2: #3F3F46;
    --accent: #FF385C;
    --accent-d: #FB7185;
    --accent-s: #4A1520;
    --ok: #22C55E;
    --okbg: #052E16;
    --warn: #EAB308;
    --warnbg: #422006;
    --bad: #EF4444;
    --badbg: #450A0A;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.4);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -2px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.6), 0 4px 6px -4px rgba(0,0,0,0.5);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.7), 0 8px 10px -6px rgba(0,0,0,0.5);
  }

  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv01','cv02','cv03','cv04','cv05','cv06','cv09','cv10','cv11','ss01','ss03';
    letter-spacing: -0.011em;
  }
  .font-bold { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; font-weight: 700; }
  .font-display-tight { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.035em; font-weight: 700; }
  .font-mono  { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: -0.01em; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  input, textarea, select, button { font-family: inherit; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.005em; }
  .uppercase-track { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; font-size: 11px; }

  /* ==================== FIELD (shadcn input) ==================== */
  .field {
    width: 100%; background: transparent; border: 1px solid var(--rule);
    padding: 8px 12px; border-radius: var(--radius); font-size: 14px; color: var(--ink);
    height: 36px;
    transition: border-color .15s ease, box-shadow .15s ease;
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    font-weight: 400; line-height: 1.4;
  }
  textarea.field { height: auto; min-height: 60px; padding-top: 8px; padding-bottom: 8px; }
  select.field { padding-right: 32px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 8px center; -webkit-appearance: none; appearance: none; }
  .field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 2px rgba(9,9,11,0.15); }
  .field::placeholder { color: var(--ink-4); }

  /* ==================== BUTTONS (shadcn button) ==================== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 16px; font-size: 14px; font-weight: 500; height: 36px;
    border-radius: var(--radius); border: 1px solid transparent; cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;
    white-space: nowrap; user-select: none;
    position: relative; line-height: 1;
  }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

  /* variantes */
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover:not(:disabled) { background: var(--ink-2); }

  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover:not(:disabled) { background: var(--accent-d); }

  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn-ghost:hover:not(:disabled) { background: var(--paper-3); border-color: var(--rule); }

  .btn-secondary { background: var(--paper-3); color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: var(--rule); }

  .btn-danger { background: var(--bad); color: white; }
  .btn-danger:hover:not(:disabled) { background: #B91C1C; }

  .btn-link { background: transparent; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; height: auto; padding: 0; }
  .btn-link:hover:not(:disabled) { color: var(--ink-2); }

  /* tamanhos */
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: calc(var(--radius) - 2px); }
  .btn-xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: calc(var(--radius) - 2px); }
  .btn-icon { height: 36px; width: 36px; padding: 0; }

  /* ==================== BADGES (shadcn badge) ==================== */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 10px; font-size: 12px; font-weight: 600; line-height: 1.4;
    border: 1px solid transparent; background: var(--paper-3); color: var(--ink);
    border-radius: 999px;
    transition: background .12s ease;
  }
  .chip-ink   { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip-ok    { color: var(--ok); background: var(--okbg); border-color: transparent; }
  .chip-warn  { color: var(--warn); background: var(--warnbg); border-color: transparent; }
  .chip-bad   { color: var(--bad); background: var(--badbg); border-color: transparent; }
  .chip-accent{ color: var(--accent-d); background: var(--accent-s); border-color: transparent; }
  .chip-solid { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .chip-outline { background: transparent; border-color: var(--rule); color: var(--ink); }

  /* ==================== CARDS (shadcn card) ==================== */
  .card {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: calc(var(--radius) + 2px); position: relative;
    transition: box-shadow .18s ease, border-color .18s ease;
    color: var(--ink);
  }
  .card-elevated { box-shadow: var(--shadow-md); }
  .card-hover { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
  .card-hover:hover { box-shadow: var(--shadow-md); border-color: var(--rule-2); }
  .card-flat { background: var(--paper-3); border: 1px solid transparent; border-radius: var(--radius); }

  .hairline { border-bottom: 1px solid var(--rule); }
  .hairline-solid { border-bottom: 1px solid var(--rule); }

  /* ==================== NAV ==================== */
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    color: var(--ink-3); font-size: 14px; font-weight: 500;
    transition: all .15s ease; position: relative;
  }
  .nav-item:hover { color: var(--ink); background: var(--paper-2); }
  .nav-item.active { color: var(--ink); background: var(--paper-2); font-weight: 600; }
  .nav-item.active svg { color: var(--accent); }
  .nav-item .badge {
    margin-left: auto; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px;
    background: var(--accent); color: white;
    padding: 1px 8px; border-radius: 999px; font-weight: 700;
  }

  /* Bottom nav mobile */
  .bnav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px 8px; color: var(--ink-3); cursor: pointer;
    font-size: 10px; font-weight: 600;
    transition: color .15s;
    background: transparent; border: none;
    position: relative;
  }
  .bnav-item.active { color: var(--accent); }
  .bnav-item.active svg { stroke-width: 2.2; }

  /* ==================== SCROLL ==================== */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: var(--rule-2); }

  /* ==================== LEAFLET ==================== */
  .leaflet-container {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--paper-2);
  }
  .leaflet-control-attribution {
    font-size: 9px !important;
    padding: 0 4px !important;
    background: rgba(255,255,255,0.7) !important;
    color: rgba(0,0,0,0.35) !important;
    opacity: 0.5;
    transition: opacity .2s;
  }
  .leaflet-control-attribution:hover { opacity: 1; }
  .leaflet-control-attribution a { color: rgba(0,0,0,0.5) !important; text-decoration: none !important; }
  .leaflet-popup-content-wrapper {
    border-radius: 12px; background: white;
    border: none; box-shadow: var(--shadow-lg);
  }
  .leaflet-popup-tip { background: white; border: none; box-shadow: var(--shadow-md); }

  .tp-marker {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; background: var(--accent); color: white;
    font-size: 12px; font-weight: 700; border-radius: 999px;
    border: 3px solid white; box-shadow: 0 4px 12px rgba(255,56,92,0.35);
  }

  /* ==================== ANIMATIONS ==================== */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; }
  .fade-in-1 { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; animation-delay: .04s; }
  .fade-in-2 { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; animation-delay: .08s; }
  .fade-in-3 { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; animation-delay: .14s; }
  .fade-in-4 { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; animation-delay: .20s; }
  .fade-in-5 { animation: fadeIn .28s cubic-bezier(.2,.7,.3,1) both; animation-delay: .28s; }

  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay-in { animation: overlayIn .18s ease-out both; }

  @keyframes stampIn { 0% { opacity: 0; transform: scale(1.8) rotate(-4deg); } 60% { opacity: 0.9; transform: scale(0.94) rotate(-4deg); } 100% { opacity: 0.88; transform: scale(1) rotate(-4deg); } }
  .stamp-in { animation: stampIn .5s cubic-bezier(.4,1.6,.4,1) both; }

  @keyframes slideRight { from { transform: translateX(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .slide-right { animation: slideRight .3s ease-out both; }

  /* ==================== PRINT ==================== */
  @media print {
    body { background: white; }
    body::before { display: none; }
    .no-print { display: none !important; }
    .card, .card-double, .card-ticket { border: 1px solid #999; box-shadow: none; }
    main { padding: 0 !important; }
    .print-block { page-break-inside: avoid; }
  }

  /* ==================== SAFE AREA ==================== */
  @supports (padding: max(0px)) {
    .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
    .safe-t { padding-top: max(env(safe-area-inset-top), 0px); }
  }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  /* Fancy underline for links */
  .link-under { background-image: linear-gradient(to right, currentColor 100%, currentColor 0); background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 100%; }

  /* Ticker style number display */
  .ticker {
    font-family: 'JetBrains Mono', monospace;
    display: inline-flex; gap: 2px;
  }
  .ticker span {
    display: inline-block; min-width: 0.7em; padding: 2px 3px;
    background: var(--ink); color: var(--paper);
    border-radius: 2px; text-align: center;
    font-weight: 500;
  }
</style>

<div id="root"></div>
<div id="errbox" style="display:none;position:fixed;inset:0;background:#FEF2F2;color:#991B1B;padding:24px;font-family:monospace;font-size:12px;overflow:auto;z-index:99999;white-space:pre-wrap"></div>

<script>
  window.addEventListener('error', function(e) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent = 'JS ERROR:\n' + (e.error && e.error.stack ? e.error.stack : e.message) + '\nat ' + e.filename + ':' + e.lineno + ':' + e.colno;
  });
  window.addEventListener('unhandledrejection', function(e) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent = 'PROMISE REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
  });
</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   TRAVEL PLANNER
   Ferramenta escalável para planejamento de viagens.
   ============================================================ */

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

/* ==================== THEME ==================== */

function useTheme() {
  const [theme, setThemeState] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const setTheme = useCallback((t) => {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch {}
    setThemeState(t);
  }, []);
  const toggleTheme = useCallback(() => setTheme(theme === 'dark' ? 'light' : 'dark'), [theme, setTheme]);
  return { theme, setTheme, toggleTheme };
}

/* ==================== CONSTANTES ==================== */

const STORAGE_KEY = 'travel-planner-v1';
const FX_CACHE_KEY = 'travel-planner-fx-cache-v1';
const WX_CACHE_KEY = 'travel-planner-wx-cache-v1';
const FX_TTL_MS = 4 * 60 * 60 * 1000; // 4h

const CURRENCIES = [
  { code: 'BRL', name: 'Real brasileiro',   symbol: 'R$'  },
  { code: 'USD', name: 'Dólar americano',   symbol: 'US$' },
  { code: 'EUR', name: 'Euro',              symbol: '€'   },
  { code: 'GBP', name: 'Libra esterlina',   symbol: '£'   },
  { code: 'ARS', name: 'Peso argentino',    symbol: 'AR$' },
  { code: 'UYU', name: 'Peso uruguaio',     symbol: 'UY$' },
  { code: 'CLP', name: 'Peso chileno',      symbol: 'CL$' },
  { code: 'MXN', name: 'Peso mexicano',     symbol: 'MX$' },
  { code: 'JPY', name: 'Iene',              symbol: '¥'   },
  { code: 'CAD', name: 'Dólar canadense',   symbol: 'C$'  },
  { code: 'AUD', name: 'Dólar australiano', symbol: 'A$'  },
  { code: 'CHF', name: 'Franco suíço',      symbol: 'CHF' },
];

const CATEGORY_COLORS = ['#0A0A0A','#525252','#78716C','#B45309','#166534','#1E40AF','#7C2D12','#991B1B','#0F766E','#5B21B6'];

const CHECKLIST_PHASES = [
  { id: 'before-book',   name: 'Antes de reservar' },
  { id: 'before-travel', name: 'Antes de viajar' },
  { id: 'on-arrival',    name: 'Na chegada' },
  { id: 'during',        name: 'Durante a viagem' },
  { id: 'after',         name: 'Depois' },
];

const BOOKING_TYPES = [
  { id: 'flight',   name: 'Voo' },
  { id: 'hotel',    name: 'Hospedagem' },
  { id: 'car',      name: 'Carro' },
  { id: 'activity', name: 'Passeio' },
  { id: 'transfer', name: 'Transfer' },
  { id: 'other',    name: 'Outro' },
];

/* ==================== UTILS ==================== */

const uid = (prefix = '') => (typeof crypto !== 'undefined' && crypto.randomUUID)
  ? crypto.randomUUID()
  : prefix + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const cx = (...args) => args.filter(a => typeof a === 'string' && a.length).join(' ');

const clone = (obj) => JSON.parse(JSON.stringify(obj));

/* ==================== TOAST (helper global + host) ==================== */

const _toastListeners = new Set();
const toast = {
  show: (message, opts = {}) => {
    const evt = {
      id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()),
      message, variant: opts.variant || 'info',
      duration: opts.duration ?? (opts.variant === 'error' ? 5000 : 3000),
    };
    _toastListeners.forEach(fn => fn(evt));
    return evt.id;
  },
  success: (m, o) => toast.show(m, { ...o, variant: 'success' }),
  error:   (m, o) => toast.show(m, { ...o, variant: 'error' }),
  info:    (m, o) => toast.show(m, { ...o, variant: 'info' }),
};

function ToastHost() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const handler = (evt) => {
      setItems(prev => [...prev, evt]);
      if (evt.duration > 0) {
        setTimeout(() => setItems(prev => prev.filter(x => x.id !== evt.id)), evt.duration);
      }
    };
    _toastListeners.add(handler);
    return () => _toastListeners.delete(handler);
  }, []);
  const dismiss = (id) => setItems(prev => prev.filter(x => x.id !== id));
  return (
    <div className="fixed bottom-4 right-4 z-[10000] flex flex-col gap-2 pointer-events-none max-w-sm">
      {items.map(t => (
        <div key={t.id} onClick={() => dismiss(t.id)}
          role="status"
          className={cx(
            'pointer-events-auto px-4 py-3 rounded-lg text-sm font-medium shadow-lg fade-in cursor-pointer border flex items-start gap-2',
            t.variant === 'success' && 'bg-paper border-ok text-ink',
            t.variant === 'error'   && 'bg-paper border-bad text-ink',
            t.variant === 'info'    && 'bg-paper border-rule-2 text-ink',
          )}
          style={{ boxShadow: 'var(--shadow-lg)' }}>
          <span className={cx('mt-0.5 text-base leading-none',
            t.variant === 'success' && 'text-ok',
            t.variant === 'error'   && 'text-bad',
            t.variant === 'info'    && 'text-ink-3',
          )}>
            {t.variant === 'success' ? '✓' : t.variant === 'error' ? '✕' : 'ⓘ'}
          </span>
          <span className="flex-1 whitespace-pre-wrap">{t.message}</span>
        </div>
      ))}
    </div>
  );
}

/** Remove duplicatas por id preservando ordem (primeiro ocorre wins). */
function uniqueById(arr) {
  const seen = new Set();
  const out = [];
  for (const item of arr) {
    if (!item || !item.id) continue;
    if (seen.has(item.id)) continue;
    seen.add(item.id);
    out.push(item);
  }
  return out;
}

function isoToday() { return new Date().toISOString().slice(0, 10); }
function isoAddDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / (1000 * 60 * 60 * 24));
}
function fmtDate(iso, opts = {}) {
  if (!iso) return '—';
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: opts.year ? 'numeric' : undefined });
  } catch { return iso; }
}
function fmtDateLong(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso + 'T00:00:00');
    const s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  } catch { return iso; }
}
function fmtDow(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  } catch { return ''; }
}

function currencySymbol(code) {
  const c = CURRENCIES.find(x => x.code === code);
  return c ? c.symbol : code;
}

function fmtMoney(amount, code = 'BRL', opts = {}) {
  if (amount == null || isNaN(amount)) return '—';
  const sym = currencySymbol(code);
  const digits = opts.digits ?? 2;
  const abs = Math.abs(amount);
  const s = abs.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return `${amount < 0 ? '-' : ''}${sym} ${s}`;
}

function fmtMoneyCompact(amount, code = 'BRL') {
  if (amount == null || isNaN(amount)) return '—';
  const sym = currencySymbol(code);
  const abs = Math.abs(amount);
  let n, suf = '';
  if (abs >= 1e6) { n = amount / 1e6; suf = 'M'; }
  else if (abs >= 1e3) { n = amount / 1e3; suf = 'k'; }
  else { n = amount; }
  const s = suf ? n.toFixed(n >= 100 || suf ? 1 : 2).replace(/\.0$/,'') : Math.round(n).toLocaleString('pt-BR');
  return `${sym} ${s}${suf}`;
}

function loadStore() {

}

/* ==================== SHARE ==================== */

function encodeTripToShareable(trip) {
  try {
    const json = JSON.stringify(trip);
    const bytes = new TextEncoder().encode(json);
    let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch { return null; }
}
function decodeShareableToTrip(str) {
  try {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}
function makeShareableUrl(trip) {
  const enc = encodeTripToShareable(trip);
  if (!enc) return null;
  return `${location.origin}${location.pathname}#trip=${enc}`;
}

/* ==================== FX (câmbio) ==================== */

async function fetchRates(base = 'BRL') {
  try {
    const cache = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
    if (cache && cache.base === base && Date.now() - cache.ts < FX_TTL_MS) return cache;
    const r = await fetch(`https://open.er-api.com/v6/latest/${base}`);
    if (!r.ok) throw new Error('fx error');
    const data = await r.json();
    if (data.result !== 'success') throw new Error('fx not success');
    const out = { base, rates: data.rates, ts: Date.now(), source: 'open.er-api.com' };
    localStorage.setItem(FX_CACHE_KEY, JSON.stringify(out));
    return out;
  } catch (e) {
    // fallback cache antigo
    try {
      const cache = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
      if (cache) return { ...cache, stale: true };
    } catch {}
    return null;
  }
}

function convert(amount, from, to, rates) {
  if (from === to) return amount;
  if (!rates || !rates.rates) return null;
  // rates baseadas em rates.base
  const b = rates.base;
  const r = rates.rates;
  if (from === b) {
    if (r[to]) return amount * r[to];
    return null;
  }
  if (to === b) {
    if (r[from]) return amount / r[from];
    return null;
  }
  if (r[from] && r[to]) return amount * (r[to] / r[from]);
  return null;
}

/* ==================== CLIMA ==================== */

async function fetchWeather(lat, lon, startDate, endDate) {
  try {
    const cacheKey = `${lat.toFixed(2)},${lon.toFixed(2)},${startDate},${endDate}`;
    const cache = JSON.parse(localStorage.getItem(WX_CACHE_KEY) || 'null');
    if (cache && cache.key === cacheKey && Date.now() - cache.ts < FX_TTL_MS) return cache.data;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&start_date=${startDate}&end_date=${endDate}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('wx error');
    const data = await r.json();
    localStorage.setItem(WX_CACHE_KEY, JSON.stringify({ key: cacheKey, ts: Date.now(), data }));
    return data;
  } catch { return null; }
}

async function geocode(query) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
    if (!r.ok) return null;
    const arr = await r.json();
    if (!arr.length) return null;
    return { lat: parseFloat(arr[0].lat), lon: parseFloat(arr[0].lon), display: arr[0].display_name };
  } catch { return null; }
}

const numOrNull = v => (v == null || v === '' ? null : Number(v));
const strOr = (v, d = '') => (v == null ? d : String(v));

function tripFromRow(row) {
  return {
    id: row.id,
    name: row.name || '',
    destination: strOr(row.destination),
    startDate: row.start_date,
    endDate: row.end_date,
    status: row.status || 'planning',
    archived: !!row.archived,
    baseCurrency: row.base_currency || 'BRL',
    secondaryCurrencies: row.secondary_currencies || [],
    budgetCeiling: parseFloat(row.budget_ceiling) || 0,
    notes: strOr(row.notes),
    ownerId: row.owner_id,
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    categories: [], travelers: [], days: [],
    checklist: [], quotes: [], mapPoints: [], members: [],
  };
}
function tripToRow(t) {
  return {
    name: t.name || '',
    destination: t.destination || '',
    start_date: t.startDate || null,
    end_date: t.endDate || null,
    status: t.status || 'planning',
    archived: !!t.archived,
    base_currency: t.baseCurrency || 'BRL',
    secondary_currencies: t.secondaryCurrencies || [],
    budget_ceiling: Number(t.budgetCeiling) || 0,
    notes: t.notes || '',
  };
}

function categoryFromRow(r) { return { id: r.id, name: r.name, color: r.color, budgeted: parseFloat(r.budgeted) || 0 }; }
function categoryToRow(c, tripId, idx) {
  return { id: c.id, trip_id: tripId, name: c.name || '', color: c.color || '#FF385C', budgeted: Number(c.budgeted) || 0, order_idx: idx || 0 };
}

function travelerFromRow(r) { return { id: r.id, name: r.name, color: r.color, linkedUserId: r.linked_user_id }; }
function travelerToRow(t, tripId, idx) {
  return { id: t.id, trip_id: tripId, name: t.name || '', color: t.color || '#222222', linked_user_id: t.linkedUserId || null, order_idx: idx || 0 };
}

function blockFromRow(r) {
  return {
    id: r.id, title: r.title || '', time: strOr(r.time), location: strOr(r.location),
    cost: r.cost == null ? null : parseFloat(r.cost),
    currency: r.currency, categoryId: r.category_id, notes: strOr(r.notes),
    link: strOr(r.link), paidBy: r.paid_by, splitBetween: r.split_between || null,
    done: !!r.done,
  };
}
function blockToRow(b, dayId, idx) {
  return {
    id: b.id, day_id: dayId, title: b.title || '', time: b.time || '', location: b.location || '',
    cost: numOrNull(b.cost), currency: b.currency || null,
    category_id: b.categoryId || null, notes: b.notes || '', link: b.link || '',
    paid_by: b.paidBy || null,
    split_between: (b.splitBetween && b.splitBetween.length) ? b.splitBetween : null,
    done: !!b.done, order_idx: idx || 0,
  };
}

function dayFromRow(r, blocks = []) {
  return { id: r.id, date: r.date, title: strOr(r.title), notes: strOr(r.notes), blocks };
}
function dayToRow(d, tripId) {
  return { id: d.id, trip_id: tripId, date: d.date, title: d.title || '', notes: d.notes || '' };
}

function checklistFromRow(r) {
  return { id: r.id, text: r.text, phase: r.phase, done: !!r.done, deadline: r.deadline, critical: !!r.critical, notes: strOr(r.notes) };
}
function checklistToRow(c, tripId, idx) {
  return { id: c.id, trip_id: tripId, text: c.text || '', phase: c.phase || 'before-book', done: !!c.done, deadline: c.deadline || null, critical: !!c.critical, notes: c.notes || '', order_idx: idx || 0 };
}

function quoteFromRow(r) {
  return {
    id: r.id, type: r.type, provider: strOr(r.provider),
    price: r.price == null ? null : parseFloat(r.price), currency: r.currency,
    benchmarkGood: r.benchmark_good == null ? null : parseFloat(r.benchmark_good),
    benchmarkOk: r.benchmark_ok == null ? null : parseFloat(r.benchmark_ok),
    benchmarkBad: r.benchmark_bad == null ? null : parseFloat(r.benchmark_bad),
    notes: strOr(r.notes), link: strOr(r.link), status: r.status || 'searching',
    createdAt: r.created_at,
  };
}
function quoteToRow(q, tripId) {
  return {
    id: q.id, trip_id: tripId, type: q.type || 'flight', provider: q.provider || '',
    price: numOrNull(q.price), currency: q.currency || null,
    benchmark_good: numOrNull(q.benchmarkGood),
    benchmark_ok: numOrNull(q.benchmarkOk),
    benchmark_bad: numOrNull(q.benchmarkBad),
    notes: q.notes || '', link: q.link || '', status: q.status || 'searching',
  };
}

function mapPointFromRow(r) {
  return { id: r.id, name: r.name, lat: parseFloat(r.lat), lon: parseFloat(r.lon), kind: r.kind || 'point', note: strOr(r.note) };
}
function mapPointToRow(p, tripId, idx) {
  return { id: p.id, trip_id: tripId, name: p.name || '', lat: p.lat, lon: p.lon, kind: p.kind || 'point', note: p.note || '', order_idx: idx || 0 };
}

function activityFromRow(r) {
  return {
    id: r.id, tripId: r.trip_id, actorId: r.actor_id,
    kind: r.kind, entityType: r.entity_type, entityId: r.entity_id,
    summary: r.summary, payload: r.payload || {}, at: r.at,
  };
}

function optionFromRow(r, votes = [], comments = []) {
  return {
    id: r.id, type: r.type || 'hotel', name: r.name || '',
    location: strOr(r.location), lat: r.lat, lon: r.lon,
    price: r.price == null ? null : parseFloat(r.price),
    currency: r.currency, priceUnit: strOr(r.price_unit),
    link: strOr(r.link), imageUrl: strOr(r.image_url), notes: strOr(r.notes),
    status: r.status || 'considering', linkedDayId: r.linked_day_id,
    createdBy: r.created_by, createdAt: r.created_at,
    votes, comments,
  };
}

async function fetchMyTrips() {
  const { data, error } = await SB
    .from('trip_members')
    .select('role, trip:trips(*)')
    .order('added_at', { ascending: false });
  if (error) throw error;
  return (data || []).map(m => ({ ...tripFromRow(m.trip), myRole: m.role }));
}

async function fetchTripFull(tripId) {
  const [t, cats, travs, days, blocks, checks, quotes, mps, members, opts, votes, comments, activity] = await Promise.all([
    SB.from('trips').select('*').eq('id', tripId).single(),
    SB.from('categories').select('*').eq('trip_id', tripId).order('order_idx'),
    SB.from('travelers').select('*').eq('trip_id', tripId).order('order_idx'),
    SB.from('days').select('*').eq('trip_id', tripId).order('date'),
    SB.from('blocks').select('*, day:days!inner(trip_id)').eq('day.trip_id', tripId).order('order_idx'),
    SB.from('checklist_items').select('*').eq('trip_id', tripId).order('order_idx'),
    SB.from('quotes').select('*').eq('trip_id', tripId).order('created_at'),
    SB.from('map_points').select('*').eq('trip_id', tripId).order('order_idx'),
    SB.from('trip_members').select('user_id, role, profiles:user_id(email, full_name, avatar_url, color)').eq('trip_id', tripId),
    SB.from('options').select('*').eq('trip_id', tripId).order('created_at', { ascending: false }),
    SB.from('option_votes').select('option_id, user_id, vote, options!inner(trip_id)').eq('options.trip_id', tripId),
    SB.from('option_comments').select('id, option_id, user_id, text, mentioned_users, created_at, options!inner(trip_id)').eq('options.trip_id', tripId).order('created_at'),
    SB.from('activity_log').select('*').eq('trip_id', tripId).order('at', { ascending: false }).limit(100),
  ]);
  if (t.error) throw t.error;
  const trip = tripFromRow(t.data);
  trip.categories = (cats.data || []).map(categoryFromRow);
  trip.travelers = (travs.data || []).map(travelerFromRow);
  trip.checklist = (checks.data || []).map(checklistFromRow);
  trip.quotes = (quotes.data || []).map(quoteFromRow);
  trip.mapPoints = (mps.data || []).map(mapPointFromRow);
  const blocksByDay = {};
  (blocks.data || []).forEach(b => { (blocksByDay[b.day_id] = blocksByDay[b.day_id] || []).push(blockFromRow(b)); });
  trip.days = (days.data || []).map(d => dayFromRow(d, blocksByDay[d.id] || []));
  trip.members = (members.data || []).map(m => ({
    userId: m.user_id, role: m.role,
    email: m.profiles?.email, name: m.profiles?.full_name, avatarUrl: m.profiles?.avatar_url, color: m.profiles?.color,
  }));
  // Options + votes + comments
  const votesByOpt = {}; (votes.data || []).forEach(v => { (votesByOpt[v.option_id] = votesByOpt[v.option_id] || []).push({ userId: v.user_id, vote: v.vote }); });
  const commentsByOpt = {}; (comments.data || []).forEach(c => { (commentsByOpt[c.option_id] = commentsByOpt[c.option_id] || []).push({ id: c.id, userId: c.user_id, text: c.text, mentionedUsers: c.mentioned_users || [], createdAt: c.created_at }); });
  trip.options = (opts.data || []).map(o => optionFromRow(o, votesByOpt[o.id] || [], commentsByOpt[o.id] || []));
  trip.activity = (activity.data || []).map(activityFromRow);
  return trip;
}

/**
 * Save "otimista": salva a viagem inteira reescrevendo os filhos.
 * Ineficiente pra volumes grandes, mas correto e simples pra 2 usuários.
 */
async function saveTripFull(trip, prev = null) {
  const id = trip.id;
  await SB.from('trips').update(tripToRow(trip)).eq('id', id);

  const upsertAndPrune = async (tableName, currentItems, toRowFn, extraKey = null) => {
    const rows = currentItems.map((it, i) => toRowFn(it, id, i));
    if (rows.length > 0) {
      const { error } = await SB.from(tableName).upsert(rows);
      if (error) throw error;
    }
    const currentIds = currentItems.map(x => x.id).filter(Boolean);
    let del = SB.from(tableName).delete();
    del = extraKey ? del.eq(extraKey.col, extraKey.val) : del.eq('trip_id', id);
    if (currentIds.length > 0) del = del.not('id', 'in', `(${currentIds.join(',')})`);
    const { error: e2 } = await del;
    if (e2) throw e2;
  };

  await upsertAndPrune('categories',      trip.categories, categoryToRow);
  await upsertAndPrune('travelers',       trip.travelers, travelerToRow);
  await upsertAndPrune('days',            trip.days, dayToRow);
  await upsertAndPrune('checklist_items', trip.checklist, checklistToRow);
  await upsertAndPrune('quotes',          trip.quotes, quoteToRow);
  await upsertAndPrune('map_points',      trip.mapPoints, mapPointToRow);

  // Blocks: 1 upsert por dia + prune por dia
  for (const day of trip.days) {
    const rows = day.blocks.map((b, i) => blockToRow(b, day.id, i));
    if (rows.length > 0) {
      const { error } = await SB.from('blocks').upsert(rows);
      if (error) throw error;
    }
    const ids = day.blocks.map(b => b.id).filter(Boolean);
    let del = SB.from('blocks').delete().eq('day_id', day.id);
    if (ids.length) del = del.not('id', 'in', `(${ids.join(',')})`);
    const { error: e2 } = await del;
    if (e2) throw e2;
  }
}

/**
 * Aceita convites pendentes via RPC (funções SECURITY DEFINER no banco):
 * 1) por email do user (accept_pending_invites)
 * 2) por token da URL (accept_invite_token)
 */
async function acceptPendingInvites(user) {
  if (!user) return [];
  const accepted = [];

  // 1) Todos os convites pendentes pro meu email
  try {
    const { data, error } = await SB.rpc('accept_pending_invites');
    if (error) console.warn('accept_pending_invites RPC:', error.message);
    else if (data && data > 0) {
      accepted.push({ count: data, via: 'email' });
      toast.success(`Você entrou em ${data} viagem${data > 1 ? 's' : ''} nova${data > 1 ? 's' : ''}.`);
    }
  } catch (e) { console.warn('accept RPC failed:', e); }

  // 2) Convite via URL ?invite=TOKEN
  const params = new URLSearchParams(window.location.search);
  const token = params.get('invite');
  if (token) {
    try {
      const { data: tripId, error } = await SB.rpc('accept_invite_token', { _token: token });
      if (error) toast.error('Erro ao aceitar convite: ' + error.message);
      else if (tripId) accepted.push({ tripId, via: 'token' });
    } catch (e) { console.warn('token RPC failed:', e); }
    params.delete('invite');
    const newSearch = params.toString();
    history.replaceState(null, '', window.location.pathname + (newSearch ? '?' + newSearch : ''));
  }

  return accepted;
}

/* ==================== AUTH CONTEXT ==================== */

const AuthContext = createContext(null);
function useAuth() { return useContext(AuthContext); }

function AuthProvider({ children }) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!SB) { setLoading(false); return; }
    SB.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setLoading(false);
    });
    const { data: sub } = SB.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session?.user) { setProfile(null); return; }
    (async () => {
      let { data } = await SB.from('profiles').select('*').eq('id', session.user.id).single();
      if (!data) {
        // Fallback: cria profile manualmente (caso trigger não pegue)
        await SB.from('profiles').upsert({
          id: session.user.id,
          email: session.user.email,
          full_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0],
        });
        const r = await SB.from('profiles').select('*').eq('id', session.user.id).single();
        data = r.data;
      }
      setProfile(data);
    })();
  }, [session]);

  const api = useMemo(() => ({
    session, user: session?.user || null, profile, loading,
    signInWithPassword: async (email, password) => {
      const { error } = await SB.auth.signInWithPassword({ email, password });
      if (error) throw error;
    },
    signUp: async (email, password, fullName) => {
      const inviteParam = new URLSearchParams(window.location.search).get('invite');
      const redirectTo = window.location.origin + window.location.pathname + (inviteParam ? `?invite=${inviteParam}` : '');
      const { data, error } = await SB.auth.signUp({
        email, password,
        options: {
          emailRedirectTo: redirectTo,
          data: { full_name: fullName || email.split('@')[0] },
        },
      });
      if (error) throw error;
      return data;
    },
    signInWithEmail: async (email) => {
      const inviteParam = new URLSearchParams(window.location.search).get('invite');
      const redirectTo = window.location.origin + window.location.pathname + (inviteParam ? `?invite=${inviteParam}` : '');
      const { error } = await SB.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirectTo },
      });
      if (error) throw error;
    },
    signInWithGoogle: async () => {
      const inviteParam = new URLSearchParams(window.location.search).get('invite');
      const redirectTo = window.location.origin + window.location.pathname + (inviteParam ? `?invite=${inviteParam}` : '');
      const { error } = await SB.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo },
      });
      if (error) throw error;
    },
    resetPassword: async (email) => {
      const redirectTo = window.location.origin + window.location.pathname + '#type=recovery';
      const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
    },
    updatePassword: async (newPassword) => {
      const { error } = await SB.auth.updateUser({ password: newPassword });
      if (error) throw error;
    },
    signOut: async () => {
      await SB.auth.signOut();
      setSession(null); setProfile(null);
    },
    updateProfile: async (patch) => {
      const { data } = await SB.from('profiles').update(patch).eq('id', session.user.id).select().single();
      if (data) setProfile(data);
    },
  }), [session, profile, loading]);

  return <AuthContext.Provider value={api}>{children}</AuthContext.Provider>;
}

  const [activeTripId, setActiveTripId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [migrationPrompt, setMigrationPrompt] = useState(null);  // { trips: [...] }
  const savingRef = useRef(0);
  const lastSavedAtRef = useRef(0);

  // Load initial trips + pre-load full data em background
  useEffect(() => {
    if (!user) { setTrips([]); setTripsById({}); setActiveTripId(null); setLoading(false); return; }
    let cancelled = false;
    (async () => {
      setLoading(true); setError(null);
      try {
        // Antes de listar, aceita quaisquer convites pendentes
        await acceptPendingInvites(user);
        const list = await fetchMyTrips();
        if (cancelled) return;
        setTrips(uniqueById(list));
        const savedActive = localStorage.getItem('active_trip_id');
        const active = list.find(t => t.id === savedActive)?.id || list[0]?.id || null;
        setActiveTripId(active);
        setLoading(false);

        // Verifica se tem dados no localStorage do app antigo
        const legacyDone = localStorage.getItem('migration_done_v1');
        if (!legacyDone) {
          const legacy = loadStore();  // ← função existente que lê STORAGE_KEY
          if (legacy && legacy.trips && legacy.trips.length > 0 && list.length === 0) {
            if (!cancelled) setMigrationPrompt({ trips: legacy.trips });
          } else {
            localStorage.setItem('migration_done_v1', 'true');
          }
        }

        // Preload full data em paralelo (não bloqueia UI)
        await Promise.all(list.map(async t => {
          try {
            const full = await fetchTripFull(t.id);
            if (!cancelled) setTripsById(m => ({ ...m, [t.id]: full }));
          } catch (e) { console.warn('preload falhou:', t.id, e.message); }
        }));
      } catch (e) {
        console.error(e); setError(e.message);
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [user]);

  // Load full trip when activeTripId changes
  useEffect(() => {
    if (!activeTripId) return;
    if (tripsById[activeTripId]) return;
    (async () => {
      try {
        const full = await fetchTripFull(activeTripId);
        setTripsById(m => ({ ...m, [activeTripId]: full }));
      } catch (e) { console.error(e); setError(e.message); }
    })();
    localStorage.setItem('active_trip_id', activeTripId);
  }, [activeTripId]);

  // Realtime subscription para trip ativa
  useEffect(() => {
    if (!activeTripId || !SB) return;
    const channel = SB.channel(`trip-${activeTripId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'trips',            filter: `id=eq.${activeTripId}` },      () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'categories',       filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'travelers',        filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'days',             filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'checklist_items',  filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'quotes',           filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'map_points',       filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'blocks' },                                                   () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_members',     filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'options',          filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'option_votes' },                                             () => refetchActive())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'option_comments' },                                          () => refetchActive())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'activity_log', filter: `trip_id=eq.${activeTripId}` }, () => refetchActive())
      .subscribe();
    return () => { SB.removeChannel(channel); };
  }, [activeTripId]);

  const refetchActive = useCallback(async () => {
    if (!activeTripId) return;
    // Ignora refetch se estou salvando (evita echo do meu proprio save)
    if (savingRef.current > 0) return;
    // Aguarda janela apos ultimo save (echo pode chegar depois do save)
    if (Date.now() - lastSavedAtRef.current < 1500) return;
    try {
      const full = await fetchTripFull(activeTripId);
      setTripsById(m => ({ ...m, [activeTripId]: full }));
      setTrips(prev => prev.map(t => t.id === activeTripId ? { ...t, ...full, categories: undefined, days: undefined } : t));
    } catch (e) { /* ignore */ }
  }, [activeTripId]);

  const refetchList = useCallback(async () => {
    try { const list = await fetchMyTrips(); setTrips(uniqueById(list)); }
    catch (e) { console.error(e); }
  }, []);

  // API compatível com store antigo
  const api = useMemo(() => ({
    loading, saving, error,
    activeTripFull: tripsById[activeTripId] || null,
    // store shape: { trips, activeTripId }
    store: {
      trips: uniqueById(trips.map(t => tripsById[t.id] || t)),  // trips com dados completos onde já carregado
      activeTripId,
    },

    setActive: (id) => setActiveTripId(id),

    updateTrip: async (id, updater) => {
      const current = tripsById[id];
      if (!current) { console.warn('updateTrip: trip não carregada:', id); return; }
      const next = updater(current);
      const withMeta = { ...next, updatedAt: new Date().toISOString() };
      setTripsById(m => ({ ...m, [id]: withMeta }));
      setTrips(prev => prev.map(t => t.id === id ? { ...t, name: withMeta.name, destination: withMeta.destination, startDate: withMeta.startDate, endDate: withMeta.endDate, budgetCeiling: withMeta.budgetCeiling, archived: withMeta.archived } : t));
      savingRef.current += 1;
      setSaving(true);
      try {
        await saveTripFull(withMeta, current);
        lastSavedAtRef.current = Date.now();
      } catch (e) {
        console.error('Save falhou:', e);
        setError(e.message);
        setTripsById(m => ({ ...m, [id]: current }));
      } finally {
        savingRef.current = Math.max(0, savingRef.current - 1);
        setSaving(savingRef.current > 0);
      }
    },

    addTrip: async (seed) => {
      if (!user) return null;
      try {
        const created = await createTripDB(seed, user.id);
        setTripsById(m => ({ ...m, [created.id]: created }));
        setTrips(prev => uniqueById([{ ...created, myRole: 'owner' }, ...prev]));
        setActiveTripId(created.id);
        return created.id;
      } catch (e) { console.error(e); setError(e.message); toast.error('Erro ao criar viagem: ' + e.message); return null; }
    },

    removeTrip: async (id) => {
      try {
        await deleteTripDB(id);
        setTripsById(m => { const n = { ...m }; delete n[id]; return n; });
        setTrips(prev => {
          const next = prev.filter(t => t.id !== id);
          if (activeTripId === id) setActiveTripId(next[0]?.id || null);
          return next;
        });
      } catch (e) { console.error(e); toast.error('Erro ao apagar: ' + e.message); }
    },

    refetchList, refetchActive,

    // Contatos = pessoas que já são membros de qualquer viagem sua (menos você)
    myContacts: (() => {
      const seen = new Set();
      const out = [];
      trips.forEach(t => {
        const full = tripsById[t.id];
        (full?.members || []).forEach(m => {
          if (!m.userId || m.userId === user?.id) return;
          if (seen.has(m.userId)) return;
          seen.add(m.userId);
          out.push(m);
        });
      });
      return out.sort((a, b) => (a.name || a.email || '').localeCompare(b.name || b.email || ''));
    })(),

    migrationPrompt,
    dismissMigration: () => {
      setMigrationPrompt(null);
      localStorage.setItem('migration_done_v1', 'true');
    },
    runMigration: async () => {
      if (!migrationPrompt || !user) return;
      setSaving(true);
      const results = [];
      for (const legacyTrip of migrationPrompt.trips) {
        try {
          const created = await createTripDB({ ...legacyTrip, id: uid() }, user.id);
          setTripsById(m => ({ ...m, [created.id]: created }));
          setTrips(prev => uniqueById([{ ...created, myRole: 'owner' }, ...prev]));
          results.push({ ok: true, name: legacyTrip.name });
        } catch (e) {
          console.error('migration falhou:', legacyTrip.name, e);
          results.push({ ok: false, name: legacyTrip.name, error: e.message });
        }
      }
      setSaving(false);
      setMigrationPrompt(null);
      localStorage.setItem('migration_done_v1', 'true');
      const failed = results.filter(r => !r.ok);
      if (failed.length === 0) toast.success(`${results.length} viagem(s) importada(s).`);
      else toast.error(`Importadas ${results.length - failed.length}/${results.length}. Falhas:\n${failed.map(f => `- ${f.name}: ${f.error}`).join('\n')}`);
    },
  }), [trips, tripsById, activeTripId, loading, saving, error, user, refetchActive, refetchList, migrationPrompt]);

  return <StoreContext.Provider value={api}>{children}</StoreContext.Provider>;
}

/* ==================== MENTION INPUT (autocomplete @) ==================== */

/**
 * Extrai userIds mencionados no texto (procura @Nome onde Nome bate com algum membro).
 * Match por: nome completo, primeiro nome, ou primeira parte do email antes de @.
 */
/**
 * Renderiza texto de comentário com menções coloridas.
 * Faz split naive: procura tokens @Palavra e checa se algum membro bate.
 */
function renderCommentText(text, members) {
  if (!text) return null;
  const parts = text.split(/(@\w+)/g);
  return parts.map((p, i) => {
    if (p.startsWith('@')) {
      const name = p.slice(1).toLowerCase();
      const found = (members || []).find(m => {
        const n = (m.name || '').toLowerCase();
        const e = (m.email || '').toLowerCase().split('@')[0];
        return n.startsWith(name) || e === name || n.split(' ').some(x => x === name);
      });
      if (found) return <span key={i} className="font-semibold text-accent-d bg-accent-s px-1 rounded">{p}</span>;
    }
    return <span key={i}>{p}</span>;
  });
}

function extractMentions(text, members) {
  if (!text) return [];
  const ids = new Set();
  const norm = (s) => (s || '').toLowerCase().replace(/[^\w\s]/g, '').trim();
  for (const m of (members || [])) {
    if (!m.userId) continue;
    const candidates = [
      m.name,
      (m.name || '').split(' ')[0],
      (m.email || '').split('@')[0],
    ].filter(Boolean).map(norm);
    const re = new RegExp('@(' + candidates.join('|').replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'i');
    if (re.test(text)) ids.add(m.userId);
  }
  return Array.from(ids);
}

function MentionInput({ value, onChange, onSubmit, members, placeholder = 'Comentar...', disabled }) {
  const [suggestions, setSuggestions] = useState([]);
  const [selectedIdx, setSelectedIdx] = useState(0);
  const inputRef = useRef(null);

  const handleChange = (e) => {
    const val = e.target.value;
    onChange(val);
    // Detecta @ recente
    const cursor = e.target.selectionStart;
    const upTo = val.slice(0, cursor);
    const match = upTo.match(/@(\w*)$/);
    if (match) {
      const q = match[1].toLowerCase();
      const list = (members || []).filter(m => {
        const n = (m.name || '').toLowerCase();
        const e2 = (m.email || '').toLowerCase();
        return n.startsWith(q) || e2.startsWith(q) || (m.name || '').split(' ').some(p => p.toLowerCase().startsWith(q));
      }).slice(0, 5);
      setSuggestions(list);
      setSelectedIdx(0);
    } else setSuggestions([]);
  };

  const pick = (m) => {
    const el = inputRef.current;
    if (!el) return;
    const cursor = el.selectionStart;
    const upTo = value.slice(0, cursor);
    const rest = value.slice(cursor);
    const replaced = upTo.replace(/@\w*$/, '@' + (m.name || m.email.split('@')[0]).split(' ')[0] + ' ');
    const next = replaced + rest;
    onChange(next);
    setSuggestions([]);
    setTimeout(() => { el.focus(); const pos = replaced.length; el.setSelectionRange(pos, pos); }, 0);
  };

  const handleKeyDown = (e) => {
    if (suggestions.length > 0) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSelectedIdx(i => (i + 1) % suggestions.length); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); setSelectedIdx(i => (i - 1 + suggestions.length) % suggestions.length); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pick(suggestions[selectedIdx]); return; }
      if (e.key === 'Escape') { setSuggestions([]); return; }
    } else if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      onSubmit?.();
    }
  };

  return (
    <div className="relative flex-1">
      <input
        ref={inputRef} type="text"
        value={value}
        onChange={handleChange} onKeyDown={handleKeyDown}
        placeholder={placeholder}
        className="field w-full"
        disabled={disabled}
      />
      {suggestions.length > 0 && (
        <div className="absolute bottom-full left-0 mb-1 bg-paper border border-rule rounded-lg overflow-hidden z-30 min-w-[220px]" style={{boxShadow: 'var(--shadow-lg)'}}>
          {suggestions.map((m, i) => (
            <button key={m.userId} type="button" onClick={() => pick(m)} onMouseEnter={() => setSelectedIdx(i)}
              className={cx('w-full text-left px-3 py-2 flex items-center gap-2 text-sm', i === selectedIdx ? 'bg-paper-2' : '')}>
              {m.avatarUrl
                ? <img src={m.avatarUrl} className="w-6 h-6 rounded-full object-cover" alt="" />
                : <span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{background: m.color || 'var(--ink-2)'}}>{(m.name?.[0] || m.email?.[0] || '?').toUpperCase()}</span>
              }
              <div className="min-w-0 flex-1">
                <div className="font-semibold truncate">{m.name || m.email}</div>
                <div className="text-[10px] text-ink-3 truncate">{m.email}</div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ==================== TRIP PRESENCE (Supabase Realtime) ==================== */

function useTripPresence(tripId, me) {
  const [online, setOnline] = useState({}); // userId -> { at, tab, name }
  useEffect(() => {
    if (!tripId || !me || !SB) return;
    const channel = SB.channel(`presence-trip-${tripId}`, {
      config: { presence: { key: me.userId } }
    });
    const rebuild = () => {
      const state = channel.presenceState();
      const next = {};
      Object.entries(state).forEach(([uid, arr]) => {
        const last = arr[arr.length - 1];
        if (last) next[uid] = last;
      });
      setOnline(next);
    };
    channel
      .on('presence', { event: 'sync' }, rebuild)
      .on('presence', { event: 'join' }, rebuild)
      .on('presence', { event: 'leave' }, rebuild)
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await channel.track({ userId: me.userId, name: me.name, at: Date.now() });
        }
      });
    return () => { SB.removeChannel(channel); };
  }, [tripId, me?.userId]);
  return online;
}

/* ==================== FX HOOK ==================== */

function useFx(baseCurrency = 'BRL') {
  const [rates, setRates] = useState(() => {
    try {
      const c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
      return c && c.base === baseCurrency ? c : null;
    } catch { return null; }
  });
  const [loading, setLoading] = useState(false);

  const refresh = useCallback(async () => {
    setLoading(true);
    const r = await fetchRates(baseCurrency);
    setRates(r);
    setLoading(false);
    return r;
  }, [baseCurrency]);

  useEffect(() => {
    // Auto-fetch on mount ou se moeda mudou
    if (!rates || rates.base !== baseCurrency || Date.now() - (rates.ts || 0) > FX_TTL_MS) {
      refresh();
    }
  // eslint-disable-next-line
  }, [baseCurrency]);

  return { rates, loading, refresh };
}

/**
 * CurrencyInput — formata como pt-BR (R$ 1.234,56) enquanto o usuário digita.
 * Valor externo (value/onChange) é sempre número puro (float) ou vazio ("").
 * currency default 'BRL' controla o símbolo mostrado.
 */
function CurrencyInput({ value, onChange, currency = 'BRL', className = '', placeholder, ...rest }) {
  const symbol = currencySymbol(currency);
  const [text, setText] = useState(() => value == null || value === '' ? '' : formatBRNumber(Number(value)));
  const [focused, setFocused] = useState(false);

  useEffect(() => {
    if (focused) return;
    if (value == null || value === '') setText('');
    else setText(formatBRNumber(Number(value)));
  }, [value, focused]);

  const handleChange = (e) => {
    const raw = e.target.value;
    // Deixa o usuário digitar dígitos, vírgula, ponto e sinal
    const cleaned = raw.replace(/[^\d,.-]/g, '');
    setText(cleaned);
    const num = parseBRNumber(cleaned);
    onChange({ target: { value: num == null ? '' : String(num) } });
  };

  const handleBlur = () => {
    setFocused(false);
    if (text === '') { onChange({ target: { value: '' } }); return; }
    const num = parseBRNumber(text);
    if (num == null) { setText(''); onChange({ target: { value: '' } }); }
    else { setText(formatBRNumber(num)); onChange({ target: { value: String(num) } }); }
  };

  return (
    <div className="relative">
      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-ink-3 pointer-events-none select-none">{symbol}</span>
      <input
        type="text" inputMode="decimal"
        value={text}
        onChange={handleChange}
        onFocus={() => setFocused(true)}
        onBlur={handleBlur}
        placeholder={placeholder || '0,00'}
        className={cx('field num pl-9', className)}
        {...rest}
      />
    </div>
  );
}

function formatBRNumber(n) {
  if (n == null || isNaN(n)) return '';
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseBRNumber(s) {
  if (!s) return null;
  // Remove tudo que não é dígito, vírgula, ponto ou sinal
  let t = String(s).trim().replace(/[^\d,.-]/g, '');
  if (!t) return null;
  // Se tem vírgula, assume que é o decimal separator BR
  if (t.includes(',')) {
    // Remove pontos (thousands sep) e troca vírgula por ponto
    t = t.replace(/\./g, '').replace(',', '.');
  }
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

function Modal({ open, onClose, children, title, footer, size = 'md' }) {
  useEffect(() => {
    if (!open) return;
    const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onEsc);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onEsc); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  const width = size === 'sm' ? 'max-w-md' : size === 'lg' ? 'max-w-3xl' : size === 'xl' ? 'max-w-5xl' : 'max-w-xl';
  const el = (
    <div className="fixed inset-0 overlay-in" style={{ backgroundColor: 'rgba(0,0,0,0.55)', zIndex: 9999 }} onClick={onClose}>
      <div className="min-h-full flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto">
        <div className={cx('w-full bg-paper fade-in rounded-2xl overflow-hidden', width)}
             style={{boxShadow: '0 20px 60px rgba(0,0,0,0.35)'}}
             onClick={e => e.stopPropagation()}>
          {title && (
            <div className="px-5 py-4 flex items-center justify-between border-b border-rule">
              <h2 className="text-lg font-bold text-ink">{title}</h2>
              <IconButton icon="x" onClick={onClose} />
            </div>
          )}
          <div className="px-5 py-5">{children}</div>
          {footer && <div className="border-t border-rule px-5 py-3 flex items-center justify-end gap-2 bg-paper-2/40">{footer}</div>}
        </div>
      </div>
    </div>
  );
  return ReactDOM.createPortal(el, document.body);
}

function AuthGate({ children }) {
  const { user, loading } = useAuth();
  const [recovery, setRecovery] = useState(() => window.location.hash.includes('type=recovery'));

  // Escuta evento de PASSWORD_RECOVERY do Supabase (dispara quando o link do email é processado)
  useEffect(() => {
    const { data: sub } = SB.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  const clearRecovery = () => {
    setRecovery(false);
    history.replaceState(null, '', window.location.pathname + window.location.search);
  };

  if (loading) return <LoadingScreen msg="verificando sessão…" />;
  if (recovery && user) return <RecoveryScreen onDone={clearRecovery} />;
  if (!user) return <LoginScreen />;
  return children;
}

function StoreGate({ children }) {
  const { loading, error } = useStore();
  if (loading) return <LoadingScreen msg="carregando suas viagens…" />;
  if (error) return <ErrorScreen msg={error} />;
  return children;
}

function LoginScreen() {
  const { signInWithPassword, signUp, signInWithEmail, signInWithGoogle, resetPassword } = useAuth();
  const [mode, setMode] = useState('login'); // login | signup | magic | forgot
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [fullName, setFullName] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');

  const reset = () => { setPassword(''); setConfirmPw(''); setError(''); setInfo(''); };

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true); setError(''); setInfo('');
    try {
      if (mode === 'login') {
        await signInWithPassword(email.trim(), password);
      } else if (mode === 'signup') {
        if (password.length < 6) throw new Error('Senha precisa de pelo menos 6 caracteres');
        if (password !== confirmPw) throw new Error('As senhas não conferem');
        const data = await signUp(email.trim(), password, fullName.trim());
        if (data?.user && !data.session) {
          setInfo('Cadastro feito. Verifique seu email para confirmar a conta antes de entrar.');
        }
      } else if (mode === 'magic') {
        await signInWithEmail(email.trim());
        setInfo('Link enviado para ' + email + '. Verifique sua caixa de entrada (e spam).');
      } else if (mode === 'forgot') {
        await resetPassword(email.trim());
        setInfo('Enviamos um link para ' + email + '. Clique nele e defina sua nova senha.');
      }
    } catch (err) {
      let msg = err.message || 'Erro';
      // Traduz erros comuns
      if (msg.includes('Invalid login credentials')) msg = 'Email ou senha errados.';
      else if (msg.includes('User already registered')) msg = 'Esse email já tem conta. Entre com sua senha.';
      else if (msg.includes('Email rate limit')) msg = 'Muitos emails enviados. Aguarde ~1 hora ou use outro email.';
      else if (msg.includes('Email not confirmed')) msg = 'Você ainda não confirmou o email. Veja sua caixa de entrada.';
      setError(msg);
    } finally { setLoading(false); }
  };

  const titles = {
    login:  { title: 'Entrar',            sub: 'Bem-vindo de volta.' },
    signup: { title: 'Criar conta',       sub: 'Rápido, sem burocracia.' },
    magic:  { title: 'Link mágico',       sub: 'Sem senha. Só clicar no email.' },
    forgot: { title: 'Recuperar senha',   sub: 'Enviamos um link pra você trocar.' },
  }[mode];

  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
      <div className="absolute inset-0 pointer-events-none opacity-40" style={{background: 'radial-gradient(ellipse at 20% 10%, var(--accents), transparent 55%)'}}></div>
      <div className="w-full max-w-md relative">
        <div className="text-center mb-8">
          <div className="w-16 h-16 rounded-full flex items-center justify-center text-white font-bold text-3xl mx-auto mb-4" style={{background: 'var(--accent)'}}>P</div>
          <h1 className="text-4xl font-black tracking-tight">Passageiro</h1>
          <p className="text-sm text-inkm mt-3">Planeje suas viagens, sozinho ou junto.</p>
        </div>

        <div className="card card-elevated p-6 sm:p-8">
          <div className="mb-5">
            <h2 className="text-xl font-bold">{titles.title}</h2>
            <p className="text-sm text-inkm mt-1">{titles.sub}</p>
          </div>


          <form onSubmit={submit} className="space-y-4">
            {mode === 'signup' && (
              <div>
                <Label>Nome</Label>
                <TextInput value={fullName} onChange={e => setFullName(e.target.value)} placeholder="Seu nome" />
              </div>
            )}

            <div>
              <Label>Email</Label>
              <TextInput type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="voce@exemplo.com" autoFocus required autoComplete="email" />
            </div>

            {(mode === 'login' || mode === 'signup') && (
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <Label className="mb-0">Senha</Label>
                  {mode === 'login' && <button type="button" onClick={() => { reset(); setMode('forgot'); }} className="text-[11px] text-accent-d hover:underline font-semibold">Esqueci</button>}
                </div>
                <TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required minLength={6} autoComplete={mode === 'login' ? 'current-password' : 'new-password'} />
              </div>
            )}

            {mode === 'signup' && (
              <div>
                <Label>Confirmar senha</Label>
                <TextInput type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="••••••••" required autoComplete="new-password" />
              </div>
            )}

            {error && <div className="text-sm text-bad bg-badbg px-3 py-2 rounded-lg">{error}</div>}
            {info  && <div className="text-sm text-ok bg-okbg px-3 py-2 rounded-lg">{info}</div>}

            <Button type="submit" variant="accent" className="w-full" disabled={loading || !email.trim() || ((mode === 'login' || mode === 'signup') && !password)}>
              {loading ? 'Aguarde…' :
                mode === 'login'  ? 'Entrar' :
                mode === 'signup' ? 'Criar conta' :
                mode === 'magic'  ? 'Enviar link mágico' :
                                    'Enviar link de recuperação'}
            </Button>
          </form>

          <div className="mt-6 pt-5 border-t border-rule text-center space-y-2">
            {mode === 'login' && (
              <>
                <div className="text-sm text-ink-3">
                  Ainda não tem conta? <button onClick={() => { reset(); setMode('signup'); }} className="text-accent-d font-semibold hover:underline">Criar</button>
                </div>
                <button onClick={() => { reset(); setMode('magic'); }} className="text-xs text-ink-3 hover:text-ink">Prefiro entrar com link no email</button>
              </>
            )}
            {mode === 'signup' && (
              <div className="text-sm text-ink-3">
                Já tem conta? <button onClick={() => { reset(); setMode('login'); }} className="text-accent-d font-semibold hover:underline">Entrar</button>
              </div>
            )}
            {(mode === 'magic' || mode === 'forgot') && (
              <button onClick={() => { reset(); setMode('login'); }} className="text-sm text-ink-3 hover:text-ink">← Voltar ao login</button>
            )}
          </div>
        </div>

        <p className="text-center text-xs text-ink-3 mt-6">
          Seus dados ficam no Supabase, criptografados e privados por padrão.
        </p>
      </div>
    </div>
  );
}

/* ==================== RESET PASSWORD SCREEN (após clicar no link do email) ==================== */

function RecoveryScreen({ onDone }) {
  const { updatePassword } = useAuth();
  const [password, setPassword] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (password.length < 6) { setError('Senha precisa de pelo menos 6 caracteres'); return; }
    if (password !== confirmPw) { setError('As senhas não conferem'); return; }
    setLoading(true); setError('');
    try {
      await updatePassword(password);
      setDone(true);
      setTimeout(() => onDone && onDone(), 1500);
    } catch (err) { setError(err.message || 'Erro ao atualizar senha'); }
    finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-full flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3" style={{background: 'var(--accent)'}}>P</div>
          <h1 className="text-2xl font-bold">Nova senha</h1>
          <p className="text-sm text-ink-3 mt-1">Defina a senha que vai usar daqui pra frente.</p>
        </div>
        {done ? (
          <div className="card card-elevated p-8 text-center">
            <div className="text-4xl mb-3">✓</div>
            <h2 className="text-xl font-bold">Senha atualizada</h2>
            <p className="text-sm text-ink-3 mt-2">Redirecionando…</p>
          </div>
        ) : (
          <form onSubmit={submit} className="card card-elevated p-6 space-y-4">
            <div>
              <Label>Nova senha</Label>
              <TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoFocus required minLength={6} autoComplete="new-password" />
            </div>
            <div>
              <Label>Confirmar</Label>
              <TextInput type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="••••••••" required autoComplete="new-password" />
            </div>
            {error && <div className="text-sm text-bad bg-badbg px-3 py-2 rounded-lg">{error}</div>}
            <Button type="submit" variant="accent" className="w-full" disabled={loading}>
              {loading ? 'Salvando…' : 'Salvar senha'}
            </Button>
          </form>
        )}
      </div>
    </div>
  );
}

function SetPasswordModal({ open, onClose }) {
  const { updatePassword } = useAuth();
  const [password, setPassword] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);

  const reset = () => { setPassword(''); setConfirmPw(''); setError(''); setDone(false); };
  useEffect(() => { if (open) reset(); }, [open]);

  const submit = async (e) => {
    e.preventDefault();
    if (password.length < 6) { setError('Senha precisa de pelo menos 6 caracteres'); return; }
    if (password !== confirmPw) { setError('As senhas não conferem'); return; }
    setLoading(true); setError('');
    try {
      await updatePassword(password);
      setDone(true);
      setTimeout(() => onClose(), 1200);
    } catch (err) { setError(err.message || 'Erro'); }
    finally { setLoading(false); }
  };

  return (
    <Modal open={open} onClose={onClose} title="Definir / alterar senha" size="sm"
      footer={<><Button onClick={onClose}>Cancelar</Button><Button variant="primary" onClick={submit} disabled={loading || done}>{done ? '✓ Salvo' : loading ? 'Salvando…' : 'Salvar'}</Button></>}>
      <form onSubmit={submit} className="space-y-3">
        <div>
          <Label>Nova senha</Label>
          <TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoFocus autoComplete="new-password" minLength={6} />
        </div>
        <div>
          <Label>Confirmar</Label>
          <TextInput type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="••••••••" autoComplete="new-password" />
        </div>
        {error && <div className="text-sm text-bad bg-badbg px-3 py-2 rounded-lg">{error}</div>}
        <p className="text-xs text-ink-3">Depois de salvar, você pode entrar com email + essa senha, sem precisar de link no email.</p>
      </form>
    </Modal>
  );
}

function AppShell() {
  const { store, activeTripFull, setActive, addTrip, migrationPrompt, dismissMigration, runMigration, saving } = useStore();
  const [convertOpen, setConvertOpen] = useState(false);
  const [showLibrary, setShowLibrary] = useState(!store.activeTripId);
  const [importPreview, setImportPreview] = useState(null);

  const activeTrip = activeTripFull;
  const openTrip = (id) => { setActive(id); setShowLibrary(false); };

  useEffect(() => {
    const hash = window.location.hash;
    if (hash.startsWith('#trip=')) {
      const encoded = hash.slice(6);
      const trip = decodeShareableToTrip(encoded);
      if (trip && trip.days) {
        setImportPreview(trip);
        history.replaceState(null, '', location.pathname);
      }
    }
  }, []);

  const acceptImport = () => {
    if (!importPreview) return;
    const t = { ...importPreview, id: uid('trip_'), name: importPreview.name + ' (compartilhada)', createdAt: new Date().toISOString() };
    addTrip(t);
    setImportPreview(null);
    setShowLibrary(false);

function destCode(destination) {
  if (!destination) return null;
  const codes = {
    'uruguai': 'URY', 'uruguay': 'URY', 'montevidéu': 'MVD', 'montevideu': 'MVD',
    'argentina': 'ARG', 'buenos aires': 'BUE',
    'chile': 'CHL', 'santiago': 'SCL',
    'peru': 'PER', 'lima': 'LIM',
    'bolívia': 'BOL', 'bolivia': 'BOL',
    'portugal': 'PRT', 'lisboa': 'LIS', 'porto': 'OPO',
    'espanha': 'ESP', 'madri': 'MAD', 'barcelona': 'BCN',
    'frança': 'FRA', 'paris': 'PAR',
    'itália': 'ITA', 'italia': 'ITA', 'roma': 'ROM',
    'brasil': 'BRA', 'rio': 'RIO', 'são paulo': 'SAO',
    'eua': 'USA', 'nova york': 'NYC', 'ny': 'NYC',
    'japão': 'JPN', 'tóquio': 'TYO',
  };
  const d = destination.toLowerCase();
  for (const [k, v] of Object.entries(codes)) if (d.includes(k)) return v;
  // fallback: primeiras 3 letras da primeira palavra
  const first = destination.split(/[\s,]+/)[0] || '';
  return first.slice(0, 3).toUpperCase();
}
